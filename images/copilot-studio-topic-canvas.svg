<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="520" fill="#F8FAFC" rx="16"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Standard Harness: Topic Canvas</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#94A3B8">Explicit construction — every path is defined in advance</text>

  <!-- TRIGGER node (diamond) -->
  <polygon points="380,74 428,104 380,134 332,104" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="380" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">Trigger</text>
  <text x="380" y="117" text-anchor="middle" font-size="10" fill="#3B82F6">User sends a message</text>

  <!-- Arrow: trigger → welcome -->
  <line x1="380" y1="134" x2="380" y2="162" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WELCOME TOPIC -->
  <rect x="296" y="166" width="168" height="52" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="380" y="189" text-anchor="middle" font-size="12" font-weight="600" fill="#1D4ED8">Welcome Topic</text>
  <text x="380" y="207" text-anchor="middle" font-size="10.5" fill="#3B82F6">Greet user · Ask intent</text>

  <!-- Arrow: welcome → decision -->
  <line x1="380" y1="218" x2="380" y2="248" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DECISION diamond -->
  <polygon points="380,250 428,276 380,302 332,276" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="380" y="273" text-anchor="middle" font-size="11" fill="#374151">Intent?</text>
  <text x="380" y="290" text-anchor="middle" font-size="9.5" fill="#6B7280">Condition</text>

  <!-- Branch label: FAQ -->
  <path d="M 332 276 L 200 276 L 200 322" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
  <rect x="148" y="264" width="36" height="16" rx="3" fill="#F8FAFC"/>
  <text x="166" y="276" text-anchor="middle" font-size="9.5" fill="#6B7280">FAQ</text>

  <!-- Branch label: Request -->
  <path d="M 428 276 L 560 276 L 560 322" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
  <rect x="484" y="264" width="52" height="16" rx="3" fill="#F8FAFC"/>
  <text x="510" y="276" text-anchor="middle" font-size="9.5" fill="#6B7280">Request</text>

  <!-- FAQ TOPIC -->
  <rect x="112" y="326" width="176" height="52" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="200" y="349" text-anchor="middle" font-size="12" font-weight="600" fill="#15803D">FAQ Topic</text>
  <text x="200" y="367" text-anchor="middle" font-size="10.5" fill="#16A34A">Answer from knowledge base</text>

  <!-- REQUEST TOPIC -->
  <rect x="472" y="326" width="176" height="52" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="560" y="349" text-anchor="middle" font-size="12" font-weight="600" fill="#C2410C">Request Topic</text>
  <text x="560" y="367" text-anchor="middle" font-size="10.5" fill="#EA580C">Collect info · Validate</text>

  <!-- Arrow: FAQ → end -->
  <line x1="200" y1="378" x2="200" y2="412" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: Request → flow -->
  <line x1="560" y1="378" x2="560" y2="412" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FAQ resolution node -->
  <rect x="116" y="416" width="168" height="48" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="200" y="437" text-anchor="middle" font-size="11.5" fill="#065F46">Resolve  ·  Confirm</text>
  <text x="200" y="454" text-anchor="middle" font-size="10" fill="#059669">End conversation</text>

  <!-- Request → Power Automate -->
  <rect x="476" y="416" width="168" height="48" rx="8" fill="#FDF4FF" stroke="#E9D5FF" stroke-width="1"/>
  <text x="560" y="437" text-anchor="middle" font-size="11.5" fill="#6B21A8">Power Automate flow</text>
  <text x="560" y="454" text-anchor="middle" font-size="10" fill="#9333EA">Submit  ·  Record  ·  Notify</text>

  <!-- Connector: both resolutions → shared end -->
  <path d="M 200 464 L 200 490 L 380 490" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  <path d="M 560 464 L 560 490 L 380 490" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2" fill="none"/>

  <!-- Caption -->
  <text x="380" y="510" text-anchor="middle" font-size="11" fill="#CBD5E1" font-style="italic">Control flow is visible at rest — you can see exactly why the agent did what it did.</text>
</svg>
