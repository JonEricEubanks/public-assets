<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .flow {
        stroke-dasharray: 8 5;
        animation: dashmove 1.2s linear infinite;
      }
      .flow-slow {
        stroke-dasharray: 5 4;
        animation: dashmove 2.4s linear infinite;
      }
      @keyframes dashmove {
        to { stroke-dashoffset: -13; }
      }
      .node {
        filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.12));
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#F8FAFC" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Standard Harness: Topic Canvas</text>
  <text x="450" y="66" text-anchor="middle" font-size="13.5" fill="#64748B">Explicit construction — every path is defined in advance</text>

  <!-- TRIGGER node (diamond) -->
  <g class="node">
    <polygon points="450,88 512,126 450,164 388,126" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="450" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">Trigger</text>
  <text x="450" y="140" text-anchor="middle" font-size="11.5" fill="#2563EB">User sends a message</text>

  <!-- Arrow: trigger → welcome -->
  <line class="flow" x1="450" y1="164" x2="450" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- WELCOME TOPIC -->
  <g class="node">
    <rect x="350" y="200" width="200" height="62" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="450" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">Welcome Topic</text>
  <text x="450" y="248" text-anchor="middle" font-size="12" fill="#3B82F6">Greet user · Ask intent</text>

  <!-- Arrow: welcome → decision -->
  <line class="flow" x1="450" y1="262" x2="450" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- DECISION diamond -->
  <g class="node">
    <polygon points="450,300 514,338 450,376 386,338" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  </g>
  <text x="450" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Intent?</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#64748B">Condition</text>

  <!-- Branch: FAQ (left) -->
  <path class="flow-slow" d="M 386 338 L 230 338 L 230 388" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="176" y="326" width="48" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="200" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">FAQ</text>

  <!-- Branch: Request (right) -->
  <path class="flow-slow" d="M 514 338 L 670 338 L 670 388" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="646" y="326" width="72" height="22" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="682" y="341" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Request</text>

  <!-- FAQ TOPIC -->
  <g class="node">
    <rect x="130" y="392" width="200" height="62" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  </g>
  <text x="230" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#15803D">FAQ Topic</text>
  <text x="230" y="440" text-anchor="middle" font-size="12" fill="#16A34A">Answer from knowledge base</text>

  <!-- REQUEST TOPIC -->
  <g class="node">
    <rect x="570" y="392" width="200" height="62" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  </g>
  <text x="670" y="419" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">Request Topic</text>
  <text x="670" y="440" text-anchor="middle" font-size="12" fill="#EA580C">Collect info · Validate</text>

  <!-- Arrow: FAQ → resolve -->
  <line class="flow" x1="230" y1="454" x2="230" y2="484" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Arrow: Request → flow -->
  <line class="flow" x1="670" y1="454" x2="670" y2="484" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- FAQ resolution node -->
  <g class="node">
    <rect x="135" y="488" width="190" height="46" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <text x="230" y="508" text-anchor="middle" font-size="12.5" font-weight="600" fill="#065F46">Resolve · Confirm</text>
  <text x="230" y="524" text-anchor="middle" font-size="11" fill="#059669">End conversation</text>

  <!-- Request → Power Automate -->
  <g class="node">
    <rect x="575" y="488" width="190" height="46" rx="10" fill="#FDF4FF" stroke="#C084FC" stroke-width="1.5"/>
  </g>
  <text x="670" y="508" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6B21A8">Power Automate flow</text>
  <text x="670" y="524" text-anchor="middle" font-size="11" fill="#9333EA">Submit · Record · Notify</text>

  <!-- Caption -->
  <text x="450" y="552" text-anchor="middle" font-size="12" fill="#94A3B8" font-style="italic">Control flow is visible at rest — you can see exactly why the agent did what it did.</text>
</svg>
