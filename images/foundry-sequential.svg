<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#f2fbf8"/><stop offset="100%" stop-color="#dcf1eb"/></radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffc466"/><stop offset="100%" stop-color="#ff7b1c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b2a25" flood-opacity=".10"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrT" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#0e8f7e"/></marker>
    <marker id="arrA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#e8730f"/></marker>
    <g id="agent">
      <circle r="26" fill="#ffffff" stroke="#0e8f7e" stroke-width="2"/>
      <rect x="-11" y="-7.5" width="22" height="16" rx="5" fill="none" stroke="#0e8f7e" stroke-width="2"/>
      <circle cx="-4.5" cy="0.5" r="2" fill="#0e8f7e"/><circle cx="4.5" cy="0.5" r="2" fill="#0e8f7e"/>
      <line x1="0" y1="-7.5" x2="0" y2="-13" stroke="#0e8f7e" stroke-width="2"/><circle cy="-15" r="2.2" fill="#ff7b1c"/>
    </g>
    <clipPath id="frame"><rect width="1200" height="460" rx="22"/></clipPath>
  </defs>
  <style>
    text{fill:#0b2a25}
    .mono{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
    .muted{fill:#3f7d73}.dim{fill:#6fa79c}
    .cyc{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
    @keyframes s1{0%,3%{opacity:.5}7%,21%{opacity:1}26%,100%{opacity:.5}}
    @keyframes s2{0%,25%{opacity:.5}29%,43%{opacity:1}48%,100%{opacity:.5}}
    @keyframes s3{0%,47%{opacity:.5}51%,65%{opacity:1}70%,100%{opacity:.5}}
    @keyframes s4{0%,69%{opacity:.5}73%,87%{opacity:1}92%,100%{opacity:.5}}
    .stamp{animation:stamp 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes stamp{0%,89%{transform:scale(1)}93%{transform:scale(1.14)}97%,100%{transform:scale(1)}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="460" fill="url(#bg)"/>

  <text x="64" y="52" font-size="13" letter-spacing="4" class="dim mono">PATTERN 01 · SEQUENTIAL</text>
  <text x="64" y="86" font-size="25" font-weight="900">Deterministic order. <tspan fill="#0e8f7e">Bounded reasoning inside each stage.</tspan></text>
  <text x="1136" y="52" text-anchor="end" font-size="11.5" class="mono dim">a.k.a. pipeline · prompt chaining · linear delegation</text>

  <!-- request -->
  <g transform="translate(64 176)">
    <rect width="104" height="96" rx="14" fill="#ffffff" stroke="#b8e3da" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="52" y="40" text-anchor="middle" font-size="22">📄</text>
    <text x="52" y="64" text-anchor="middle" font-size="12" font-weight="700">Request</text>
    <text x="52" y="80" text-anchor="middle" font-size="10" class="dim mono">records inquiry</text>
  </g>

  <!-- stages: x = 200, 416, 632, 848 ; width 176 ; gap 40 -->
  <g class="cyc s1" transform="translate(200 124)">
    <rect width="176" height="200" rx="16" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" font-weight="800" fill="#0e6f62">STAGE 1</text>
    <g transform="translate(88 96)"><use href="#agent"/></g>
    <text x="88" y="152" text-anchor="middle" font-size="13.5" font-weight="700">Classify</text>
    <text x="88" y="172" text-anchor="middle" font-size="10.5" class="muted">request type · urgency</text>
  </g>
  <g class="cyc s2" transform="translate(416 124)">
    <rect width="176" height="200" rx="16" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" font-weight="800" fill="#0e6f62">STAGE 2</text>
    <g transform="translate(88 96)"><use href="#agent"/></g>
    <text x="88" y="152" text-anchor="middle" font-size="13.5" font-weight="700">Extract criteria</text>
    <text x="88" y="172" text-anchor="middle" font-size="10.5" class="muted">dates · parties · scope</text>
  </g>
  <g class="cyc s3" transform="translate(632 124)">
    <rect width="176" height="200" rx="16" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" font-weight="800" fill="#0e6f62">STAGE 3</text>
    <g transform="translate(88 96)"><use href="#agent"/></g>
    <text x="88" y="152" text-anchor="middle" font-size="13.5" font-weight="700">Policy check</text>
    <text x="88" y="172" text-anchor="middle" font-size="10.5" class="muted">retention · exemptions</text>
  </g>
  <g class="cyc s4" transform="translate(848 124)">
    <rect width="176" height="200" rx="16" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="16" y="26" font-size="10" letter-spacing="2" font-weight="800" fill="#0e6f62">STAGE 4</text>
    <g transform="translate(88 96)"><use href="#agent"/></g>
    <text x="88" y="152" text-anchor="middle" font-size="13.5" font-weight="700">Draft response</text>
    <text x="88" y="172" text-anchor="middle" font-size="10.5" class="muted">for human review</text>
  </g>

  <!-- connectors, y = 224 -->
  <g stroke="#0e8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrT)">
    <path d="M170 224 L196 224"/><path d="M378 224 L412 224"/><path d="M594 224 L628 224"/><path d="M810 224 L844 224"/>
  </g>
  <path d="M1026 224 L1058 224" stroke="#e8730f" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/>

  <!-- human gate -->
  <g transform="translate(1100 224)">
    <g class="stamp">
      <circle r="34" fill="url(#mango)" filter="url(#glow)"/>
      <circle r="27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity=".85"/>
      <circle cy="-7" r="7" fill="#3a1c00"/><path d="M-12 12 a12 12 0 0 1 24 0 z" fill="#3a1c00"/>
    </g>
    <text y="58" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">APPROVAL</text>
    <text y="73" text-anchor="middle" font-size="9.5" class="dim">gate</text>
  </g>

  <!-- travelling artifact, above the stages -->
  <g>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0.03;0.03;0.25;0.25;0.47;0.47;0.69;0.69;0.91;0.91;1;1"
      keyTimes="0;0.03;0.07;0.25;0.29;0.47;0.51;0.69;0.73;0.91;0.95;1;1"
      path="M116,110 L288,110 L504,110 L720,110 L936,110 L1100,110 L1100,110"/>
    <rect x="-10" y="-12" width="20" height="24" rx="3" fill="#ffffff" stroke="#e8730f" stroke-width="1.5"/>
    <g stroke="#e8730f" stroke-width="1.3"><line x1="-5" y1="-5" x2="5" y2="-5"/><line x1="-5" y1="0" x2="5" y2="0"/><line x1="-5" y1="5" x2="2" y2="5"/></g>
  </g>

  <!-- workflow rail -->
  <rect x="200" y="346" width="824" height="36" rx="18" fill="#ffffff" stroke="#b8e3da" stroke-width="1.5"/>
  <text x="612" y="369" text-anchor="middle" font-size="12" class="mono" fill="#0e6f62">Agent Framework workflow — enforces order · owns transitions · forwards only the required context</text>

  <text x="600" y="424" text-anchor="middle" font-size="14.5" class="muted">The workflow enforces the stages. Agents reason only inside them.</text>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="21" fill="none" stroke="#b8e3da" stroke-width="2"/>
</svg>
