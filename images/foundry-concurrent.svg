<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#f2fbf8"/><stop offset="100%" stop-color="#dcf1eb"/></radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffc466"/><stop offset="100%" stop-color="#ff7b1c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b2a25" flood-opacity=".10"/></filter>
    <marker id="arrT" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#0e8f7e"/></marker>
    <marker id="arrA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#e8730f"/></marker>
    <g id="agent">
      <circle r="22" fill="#ffffff" stroke="#0e8f7e" stroke-width="2"/>
      <rect x="-9" y="-6.5" width="18" height="13" rx="4" fill="none" stroke="#0e8f7e" stroke-width="2"/>
      <circle cx="-4" cy="0.5" r="1.7" fill="#0e8f7e"/><circle cx="4" cy="0.5" r="1.7" fill="#0e8f7e"/>
      <line x1="0" y1="-6.5" x2="0" y2="-11" stroke="#0e8f7e" stroke-width="2"/><circle cy="-12.5" r="1.9" fill="#ff7b1c"/>
    </g>
    <clipPath id="frame"><rect width="1200" height="560" rx="22"/></clipPath>
  </defs>
  <style>
    text{fill:#0b2a25}
    .mono{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
    .muted{fill:#3f7d73}.dim{fill:#6fa79c}
    .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .cyc{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .w1{animation-name:work}.w2{animation-name:work;animation-delay:-.3s}.w3{animation-name:work;animation-delay:-.6s}.w4{animation-name:work;animation-delay:-.9s}
    @keyframes work{0%,16%{opacity:.5}26%,60%{opacity:1}70%,100%{opacity:.5}}
    .merge{animation:merge 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes merge{0%,62%{opacity:.6;transform:scale(1)}70%{opacity:1;transform:scale(1.06)}78%,100%{opacity:1;transform:scale(1)}}
    .tick{animation:tick 8s ease-in-out infinite}
    @keyframes tick{0%,80%{opacity:0}86%,97%{opacity:1}100%{opacity:0}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="560" fill="url(#bg)"/>

  <text x="64" y="52" font-size="13" letter-spacing="4" class="dim mono">PATTERN 02 · CONCURRENT</text>
  <text x="64" y="86" font-size="25" font-weight="900">Same request, parallel specialists. <tspan fill="#0e8f7e">One merge. One write.</tspan></text>
  <text x="1136" y="52" text-anchor="end" font-size="11.5" class="mono dim">a.k.a. fan-out / fan-in · scatter-gather · map-reduce</text>

  <!-- request -->
  <g transform="translate(64 258)">
    <rect width="132" height="100" rx="14" fill="#ffffff" stroke="#b8e3da" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="66" y="40" text-anchor="middle" font-size="22">🏗️</text>
    <text x="66" y="66" text-anchor="middle" font-size="12" font-weight="700">Permit package</text>
    <text x="66" y="82" text-anchor="middle" font-size="10" class="dim mono">one request</text>
  </g>
  <path d="M198 308 L246 308" stroke="#0e8f7e" stroke-width="2.5" fill="none"/>
  <circle cx="256" cy="308" r="9" fill="#0e8f7e"/>
  <text x="256" y="338" text-anchor="middle" font-size="9.5" letter-spacing="2" font-weight="800" fill="#0e6f62">FAN-OUT</text>

  <!-- fan-out curves to lane midpoints (y = 166, 262, 358, 454) -->
  <g class="flow" stroke="#0e8f7e" stroke-width="2" fill="none" marker-end="url(#arrT)">
    <path d="M264 304 C 320 304, 330 166, 386 166"/>
    <path d="M264 306 C 320 306, 330 262, 386 262"/>
    <path d="M264 310 C 320 310, 330 358, 386 358"/>
    <path d="M264 312 C 320 312, 330 454, 386 454"/>
  </g>

  <!-- lanes: x=392, w=300, h=72 -->
  <g class="cyc w1" transform="translate(392 130)">
    <rect width="300" height="72" rx="14" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="1.5"/>
    <g transform="translate(40 36)"><use href="#agent"/></g>
    <text x="78" y="32" font-size="13.5" font-weight="700">Zoning &amp; code compliance</text>
    <text x="78" y="50" font-size="10.5" class="muted">returns: conflicts · variances</text>
    <rect x="238" y="40" width="50" height="16" rx="8" fill="#ffffff" stroke="#9fcdc3"/><text x="263" y="51.5" text-anchor="middle" font-size="8.5" class="mono" fill="#0e6f62">{ json }</text>
  </g>
  <g class="cyc w2" transform="translate(392 226)">
    <rect width="300" height="72" rx="14" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="1.5"/>
    <g transform="translate(40 36)"><use href="#agent"/></g>
    <text x="78" y="32" font-size="13.5" font-weight="700">Accessibility review</text>
    <text x="78" y="50" font-size="10.5" class="muted">returns: ADA findings · severity</text>
    <rect x="238" y="40" width="50" height="16" rx="8" fill="#ffffff" stroke="#9fcdc3"/><text x="263" y="51.5" text-anchor="middle" font-size="8.5" class="mono" fill="#0e6f62">{ json }</text>
  </g>
  <g class="cyc w3" transform="translate(392 322)">
    <rect width="300" height="72" rx="14" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="1.5"/>
    <g transform="translate(40 36)"><use href="#agent"/></g>
    <text x="78" y="32" font-size="13.5" font-weight="700">Environmental screen</text>
    <text x="78" y="50" font-size="10.5" class="muted">returns: flags · policies</text>
    <rect x="238" y="40" width="50" height="16" rx="8" fill="#ffffff" stroke="#9fcdc3"/><text x="263" y="51.5" text-anchor="middle" font-size="8.5" class="mono" fill="#0e6f62">{ json }</text>
  </g>
  <g class="cyc w4" transform="translate(392 418)">
    <rect width="300" height="72" rx="14" fill="#e9f8f4" stroke="#0e8f7e" stroke-width="1.5"/>
    <g transform="translate(40 36)"><use href="#agent"/></g>
    <text x="78" y="32" font-size="13.5" font-weight="700">Fee &amp; schedule estimate</text>
    <text x="78" y="50" font-size="10.5" class="muted">returns: cost bands · timeline</text>
    <rect x="238" y="40" width="50" height="16" rx="8" fill="#ffffff" stroke="#9fcdc3"/><text x="263" y="51.5" text-anchor="middle" font-size="8.5" class="mono" fill="#0e6f62">{ json }</text>
  </g>

  <!-- structured findings: converge on a fan-in node, then one arrow into merge -->
  <text x="760" y="112" text-anchor="middle" font-size="9.5" letter-spacing="2" font-weight="800" fill="#0e6f62">STRUCTURED FINDINGS</text>
  <g class="flow" stroke="#0e8f7e" stroke-width="2" fill="none">
    <path d="M694 166 C 740 166, 740 306, 764 308"/>
    <path d="M694 262 C 740 262, 740 306, 764 308"/>
    <path d="M694 358 C 740 358, 740 310, 764 308"/>
    <path d="M694 454 C 740 454, 740 310, 764 308"/>
  </g>
  <circle cx="770" cy="308" r="9" fill="#0e8f7e"/>
  <text x="770" y="338" text-anchor="middle" font-size="9.5" letter-spacing="2" font-weight="800" fill="#0e6f62">FAN-IN</text>
  <path d="M780 308 L818 308" stroke="#0e8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrT)"/>

  <!-- merge hexagon -->
  <g transform="translate(880 308)"><g class="merge">
    <path d="M0 -62 L56 -30 L56 30 L0 62 L-56 30 L-56 -30 Z" fill="#ffffff" stroke="#0e8f7e" stroke-width="2.5" filter="url(#shadow)"/>
    <text y="-12" text-anchor="middle" font-size="12" font-weight="800" fill="#0e6f62">MERGE</text>
    <text y="6" text-anchor="middle" font-size="9.5" class="dim">validate</text>
    <text y="20" text-anchor="middle" font-size="9.5" class="dim">resolve conflicts</text>
    <text y="34" text-anchor="middle" font-size="9.5" class="dim">synthesize</text>
  </g></g>
  <text x="880" y="392" text-anchor="middle" font-size="10" class="mono muted">rules · voting · weighted · model</text>

  <!-- one write -->
  <path class="flow" d="M940 308 L994 308" stroke="#e8730f" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/>
  <text x="968" y="292" text-anchor="middle" font-size="9.5" letter-spacing="1" font-weight="800" fill="#b45309">1 WRITE</text>
  <g transform="translate(1006 258)">
    <rect width="130" height="100" rx="14" fill="#ffffff" stroke="#e8730f" stroke-width="2" filter="url(#shadow)"/>
    <g transform="translate(65 34)" fill="none" stroke="#e8730f" stroke-width="2"><ellipse rx="16" ry="6"/><path d="M-16 0 v14 a16 6 0 0 0 32 0 v-14"/></g>
    <text x="65" y="70" text-anchor="middle" font-size="12" font-weight="700">Record</text>
    <text x="65" y="86" text-anchor="middle" font-size="10" class="dim mono">Dataverse</text>
    <g class="tick"><circle cx="116" cy="14" r="9" fill="url(#mango)"/><text x="116" y="18" text-anchor="middle" font-size="10" font-weight="900" fill="#3a1c00">✓</text></g>
  </g>

  <!-- rule chip -->
  <g transform="translate(64 380)">
    <rect width="132" height="62" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="66" y="22" text-anchor="middle" font-size="9.5" letter-spacing="2" font-weight="800" fill="#b45309">RULE</text>
    <text x="66" y="39" text-anchor="middle" font-size="9.5" fill="#9a3412">no agent writes the</text>
    <text x="66" y="52" text-anchor="middle" font-size="9.5" fill="#9a3412">authoritative record</text>
  </g>

  <text x="600" y="530" text-anchor="middle" font-size="14.5" class="muted">Four perspectives, one merge point, one write.</text>
  </g>
  <rect x="1" y="1" width="1198" height="558" rx="21" fill="none" stroke="#b8e3da" stroke-width="2"/>
</svg>
