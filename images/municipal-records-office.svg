<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc"><title id="title">The memory / Preserve the public record</title><desc id="desc">A stone municipal records office sits beside a brass-handled archive cabinet and a leather asset register. The work-order drawer slowly opens and closes while city-hall windows glow. All displayed IDs are fictional.</desc>
