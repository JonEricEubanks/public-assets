<path d="M98 159L109 193L121 180L137 190L126 157Z" fill="#b78358"/><text x="53" y="47" font-size="13" style="fill:#f1ca85" class="mono">MUNICIPAL RECORD</text><text x="51" y="87" font-size="20" style="fill:#f1ca85" font-weight="600">ASSET REGISTER</text><text x="56" y="119" font-size="17" style="fill:#94bee8" >WM-481 / ACTIVE</text><path class="draft" d="M51 137L222 125" stroke="#f1ca85" stroke-width="2"/></g><text x="74" y="580" font-size="23" style="fill:#94bee8" font-weight="600">THE CITY&#x27;S MEMORY</text><text x="74" y="612" font-size="19" style="fill:#becbd0" >Keys, constraints, transactions.</text><text x="643" y="580" font-size="23" style="fill:#94bee8" font-weight="600">THE RECORD IS EXACT</text><text x="643" y="612" font-size="19" style="fill:#becbd0" >An identifier is not a similarity score.</text><rect width="1400" height="680" fill="url(#grain)"/><text x="54" y="46" font-size="16" style="fill:#f1ca85" class="mono">CIVIC EVIDENCE LAB / A CITY READ FOUR WAYS</text><text x="52" y="107" font-size="44" font-weight="700">The memory / Preserve the public record</text><text x="54" y="148" font-size="23" style="fill:#c6d3d5" >Relational records are the city&#x27;s memory: exact identifiers and protected transactions.</text><text x="54" y="658" font-size="14" style="fill:#b0c2c9" class="mono">CONCEPTUAL MUNICIPAL SCENE / NOT PRODUCT UI</text></g><rect x="1" y="1" width="1398" height="678" rx="21" fill="none" stroke="#66818d" stroke-opacity=".5"/></svg>
