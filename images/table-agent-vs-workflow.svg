<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <clipPath id="round"><rect width="1000" height="252" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="252" fill="#ffffff"/>
    <!-- Header -->
    <rect width="1000" height="48" fill="#2f5496"/>
    <!-- Striped rows -->
    <rect y="48" width="1000" height="52" fill="#ffffff"/>
    <rect y="100" width="1000" height="52" fill="#f4f7fc"/>
    <rect y="152" width="1000" height="52" fill="#ffffff"/>
    <rect y="204" width="1000" height="48" fill="#f4f7fc"/>
    <!-- Row borders -->
    <line x1="0" y1="100" x2="1000" y2="100" stroke="#e4e9f2"/>
    <line x1="0" y1="152" x2="1000" y2="152" stroke="#e4e9f2"/>
    <line x1="0" y1="204" x2="1000" y2="204" stroke="#e4e9f2"/>
    <!-- Header text -->
    <g fill="#ffffff" font-size="15" font-weight="600" letter-spacing="0.5">
      <text x="280" y="31">Agent</text>
      <text x="620" y="31">Workflow</text>
    </g>
    <!-- Body text -->
    <g font-size="14" fill="#1a1a1a">
      <text x="20" y="82" font-weight="700">Behavior</text>
      <text x="280" y="82">Adaptive, goal-seeking</text>
      <text x="620" y="82">Deterministic sequence</text>

      <text x="20" y="134" font-weight="700">Path</text>
      <text x="280" y="134">Reasoned at runtime</text>
      <text x="620" y="134">Defined in advance</text>

      <text x="20" y="186" font-weight="700">Best for</text>
      <text x="280" y="186">Ambiguity and judgment</text>
      <text x="620" y="186">Predictable, repeatable steps</text>

      <text x="20" y="234" font-weight="700">Credit cost</text>
      <text x="280" y="234">Higher, model reasoning</text>
      <text x="620" y="234">Lower, structured execution</text>
    </g>
  </g>
</svg>
