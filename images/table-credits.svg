<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="152" viewBox="0 0 1000 152" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <clipPath id="round"><rect width="1000" height="152" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="152" fill="#ffffff"/>
    <!-- Header -->
    <rect width="1000" height="48" fill="#2f5496"/>
    <!-- Striped rows -->
    <rect y="48" width="1000" height="52" fill="#ffffff"/>
    <rect y="100" width="1000" height="52" fill="#f4f7fc"/>
    <!-- Row border -->
    <line x1="0" y1="100" x2="1000" y2="100" stroke="#e4e9f2"/>
    <!-- Header text -->
    <g fill="#ffffff" font-size="15" font-weight="600" letter-spacing="0.5">
      <text x="20" y="31">Scenario</text>
      <text x="480" y="31">Approximate credits</text>
      <text x="760" y="31">Roughly</text>
    </g>
    <!-- Body text -->
    <g font-size="14" fill="#1a1a1a">
      <text x="20" y="81">Lighter conversation</text>
      <text x="480" y="81">100&#8211;300</text>
      <text x="760" y="81">$1&#8211;$3</text>

      <text x="20" y="132">Heavier, multi-step work</text>
      <text x="480" y="132">500+</text>
      <text x="760" y="132">$5+</text>
    </g>
  </g>
</svg>
