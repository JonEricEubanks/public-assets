<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/><stop offset="100%" stop-color="#ff7b1c"/>
    </linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .rail{stroke-dasharray:6 10;animation:march 1.6s linear infinite}
    @keyframes march{to{stroke-dashoffset:-16}}
    .comet{animation:fly 7s ease-in-out infinite}
    @keyframes fly{0%{transform:translateX(0)}50%{transform:translateX(1040px)}100%{transform:translateX(0)}}
    .tail{animation:tailflip 7s ease-in-out infinite}
    @keyframes tailflip{0%,49%{transform:scaleX(1)}50%,99%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  </style>

  <line class="rail" x1="40" y1="35" x2="1160" y2="35" stroke="#2a7a6d" stroke-width="2" stroke-linecap="round"/>
  <g class="pulse"><circle cx="600" cy="35" r="3" fill="#55d8c7"/></g>

  <g transform="translate(80 35)">
    <g class="comet">
      <g class="tail">
        <rect x="-46" y="-1.5" width="46" height="3" rx="1.5" fill="url(#mango)" opacity=".45"/>
      </g>
      <circle r="6" fill="url(#mango)" filter="url(#glow)"/>
    </g>
  </g>
</svg>
