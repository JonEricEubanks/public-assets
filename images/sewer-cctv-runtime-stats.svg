  <style>
    .mono{font-family:'Cascadia Code','Cascadia Mono',Consolas,'Courier New',monospace}
    .muted{fill:#8bb4d6}.dim{fill:#4f7699}
    .band{animation:band 7s linear infinite}
    @keyframes band{0%{transform:translateY(-160px)}100%{transform:translateY(466px)}}
    .corner{animation:corner 2.4s ease-in-out infinite}
    @keyframes corner{0%,100%{opacity:.35}50%{opacity:1}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:.12}}
    .spin{animation:spin 4s linear infinite;transform-origin:0 0}
    .spin2{animation:spin 2.4s linear infinite;transform-origin:0 0}
    .spinr{animation:spin 9s linear infinite reverse;transform-origin:0 0}
    .spinslow{animation:spin 60s linear infinite;transform-origin:0 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .under{stroke-dasharray:1;animation:under 12s linear infinite}
    @keyframes under{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}18%{stroke-dashoffset:0}94%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    .ping{animation:ping 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping{0%{transform:scale(.2);opacity:1}35%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
    .lock{animation:lock 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes lock{0%{transform:scale(1.9);opacity:0}9%{transform:scale(1);opacity:1}70%{transform:scale(1);opacity:1}88%,100%{transform:scale(1);opacity:.28}}
    .lbl{animation:lbl 4s linear infinite}
    @keyframes lbl{0%{opacity:.3}7%{opacity:1}70%{opacity:1}88%,100%{opacity:.3}}
    .bar0{animation:bar0 12s linear infinite}
    @keyframes bar0{0%,18%{width:0}24%{width:123px}96%{width:123px}100%{width:0}}
    .v0{animation:v0 12s linear infinite}
    @keyframes v0{0.00%{opacity:0}22.00%{opacity:0}24.00%{opacity:1}95.00%{opacity:1}97.00%{opacity:0}100.00%{opacity:0}}
    .bar1{animation:bar1 12s linear infinite}
    @keyframes bar1{0%,24%{width:0}30%{width:153px}96%{width:153px}100%{width:0}}
    .v1{animation:v1 12s linear infinite}
    @keyframes v1{0.00%{opacity:0}28.00%{opacity:0}30.00%{opacity:1}95.00%{opacity:1}97.00%{opacity:0}100.00%{opacity:0}}
    .bar2{animation:bar2 12s linear infinite}
    @keyframes bar2{0%,30%{width:0}36%{width:194px}96%{width:194px}100%{width:0}}
    .v2{animation:v2 12s linear infinite}
    @keyframes v2{0.00%{opacity:0}34.00%{opacity:0}36.00%{opacity:1}95.00%{opacity:1}97.00%{opacity:0}100.00%{opacity:0}}
    .bar3{animation:bar3 12s linear infinite}
    @keyframes bar3{0%,36%{width:0}58%{width:583px}96%{width:583px}100%{width:0}}
    .v3{animation:v3 12s linear infinite}
    @keyframes v3{0.00%{opacity:0}56.00%{opacity:0}58.00%{opacity:1}95.00%{opacity:1}97.00%{opacity:0}100.00%{opacity:0}}
    .ghost{animation:ghost 12s linear infinite}
    @keyframes ghost{0.00%{opacity:0}58.00%{opacity:0}60.00%{opacity:1}95.00%{opacity:1}97.00%{opacity:0}100.00%{opacity:0}}
    .res{animation:res 12s linear infinite}
    @keyframes res{0.00%{opacity:0}15.50%{opacity:0}17.00%{opacity:1}95.00%{opacity:1}96.50%{opacity:0}100.00%{opacity:0}}
    .foot{animation:foot 12s linear infinite}
    @keyframes foot{0.00%{opacity:0}60.00%{opacity:0}62.00%{opacity:1}95.00%{opacity:1}97.00%{opacity:0}100.00%{opacity:0}}
    .glitch{animation:glitch 12s steps(1) infinite}
    @keyframes glitch{0%,56%{transform:translateX(0)}57%{transform:translateX(3px)}58%{transform:translateX(-3px)}59%{transform:translateX(2px)}60%,100%{transform:translateX(0)}}
    .wallp{animation:wallp 2.4s ease-in-out infinite}
    @keyframes wallp{0%,100%{opacity:.55}50%{opacity:1}}
    [class]{animation-fill-mode:both}
