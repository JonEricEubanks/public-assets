<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041a17"/><stop offset="100%" stop-color="#02100e"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/><stop offset="100%" stop-color="#ff7b1c"/>
    </linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="cres"><rect x="-26" y="-26" width="52" height="52" fill="#fff"/><circle cx="10" cy="-6" r="19" fill="#000"/></mask>
    <path id="gh" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    <path id="cp" d="M23.922 16.997C23.061 18.492 18.063 22.02 12 22.02 5.937 22.02.939 18.492.078 16.997A.641.641 0 0 1 0 16.741v-2.869a.883.883 0 0 1 .053-.22c.372-.935 1.347-2.292 2.605-2.656.167-.429.414-1.055.644-1.517a10.098 10.098 0 0 1-.052-1.086c0-1.331.282-2.499 1.132-3.368.397-.406.89-.717 1.474-.952C7.255 2.937 9.248 1.98 11.978 1.98c2.731 0 4.767.957 6.166 2.093.584.235 1.077.546 1.474.952.85.869 1.132 2.037 1.132 3.368 0 .368-.014.733-.052 1.086.23.462.477 1.088.644 1.517 1.258.364 2.233 1.721 2.605 2.656a.841.841 0 0 1 .053.22v2.869a.641.641 0 0 1-.078.256Zm-11.75-5.992h-.344a4.359 4.359 0 0 1-.355.508c-.77.947-1.918 1.492-3.508 1.492-1.725 0-2.989-.359-3.782-1.259a2.137 2.137 0 0 1-.085-.104L4 11.746v6.585c1.435.779 4.514 2.179 8 2.179 3.486 0 6.565-1.4 8-2.179v-6.585l-.098-.104s-.033.045-.085.104c-.793.9-2.057 1.259-3.782 1.259-1.59 0-2.738-.545-3.508-1.492a4.359 4.359 0 0 1-.355-.508Zm2.328 3.25c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm-5 0c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm3.313-6.185c.136 1.057.403 1.913.878 2.497.442.544 1.134.938 2.344.938 1.573 0 2.292-.337 2.657-.751.384-.435.558-1.15.558-2.361 0-1.14-.243-1.847-.705-2.319-.477-.488-1.319-.862-2.824-1.025-1.487-.161-2.192.138-2.533.529-.269.307-.437.808-.438 1.578v.021c0 .265.021.562.063.893Zm-1.626 0c.042-.331.063-.628.063-.894v-.02c-.001-.77-.169-1.271-.438-1.578-.341-.391-1.046-.69-2.533-.529-1.505.163-2.347.537-2.824 1.025-.462.472-.705 1.179-.705 2.319 0 1.211.175 1.926.558 2.361.365.414 1.084.751 2.657.751 1.21 0 1.902-.394 2.344-.938.475-.584.742-1.44.878-2.497Z"/>
    <clipPath id="frame"><rect width="1200" height="560" rx="20"/></clipPath>
  </defs>
  <style>
    text{fill:#e8fffa}
    .mono{font-family:'Cascadia Code',Consolas,monospace}
    .muted{fill:#7fbfb4}.dim{fill:#4f8f84}
    .tw1,.tw2,.tw3{animation-name:tw;animation-duration:3.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .tw2{animation-delay:-1.1s}.tw3{animation-delay:-2.2s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}
    .shoot{animation-name:shoot;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:linear}
    @keyframes shoot{0%,41%{opacity:0;transform:translate(0,0)}43.5%{opacity:1}48%{opacity:0;transform:translate(-210px,95px)}100%{opacity:0}}
    .cyc{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:linear}
    .wait{animation-name:waitBadge}
    @keyframes waitBadge{0%,44%{opacity:0;transform:scale(.6)}48%{opacity:1;transform:scale(1.1)}50%{transform:scale(1)}78%{opacity:1}83%,100%{opacity:0}}
    .youPulse{animation-name:youPulse;animation-duration:2.6s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    @keyframes youPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .zap{animation-name:zap;animation-duration:2.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    @keyframes zap{0%,100%{opacity:.35}50%{opacity:1}}
    .mA{animation-name:mergeA}.mB{animation-name:mergeB}
    @keyframes mergeA{0%,67%{opacity:0;transform:scale(.5)}71%{opacity:1;transform:scale(1)}100%{opacity:1}}
    @keyframes mergeB{0%,93%{opacity:0;transform:scale(.5)}97%{opacity:1;transform:scale(1)}100%{opacity:1}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="560" fill="url(#bg)"/>

  <text x="60" y="50" font-size="15" letter-spacing="5" class="dim" font-weight="600">THE NIGHT SHIFT · EP 2 — THE DELEGATION LINE</text>
  <text x="60" y="74" font-size="13" class="muted">two agent lines, every train terminates at the same interchange: you</text>

  <!-- night sky -->
  <g fill="#8ef0e0">
    <circle class="tw1" cx="240" cy="110" r="1.3"/><circle class="tw2" cx="420" cy="120" r="1.2"/>
    <circle class="tw3" cx="560" cy="50" r="1.4"/><circle class="tw1" cx="700" cy="90" r="1.2"/>
    <circle class="tw2" cx="940" cy="55" r="1.5"/><circle class="tw3" cx="1150" cy="140" r="1.2"/>
  </g>
  <g transform="translate(1090 70)">
    <circle r="32" fill="#ff7b1c" opacity=".08"/>
    <circle r="22" fill="url(#mango)" mask="url(#cres)" opacity=".92"/>
  </g>
  <g transform="translate(1000 55)">
    <g class="shoot">
      <line x1="0" y1="0" x2="30" y2="-14" stroke="#8ef0e0" stroke-width="2" stroke-linecap="round" opacity=".8"/>
      <circle r="2.2" fill="#e8fffa"/>
    </g>
  </g>

  <!-- conflict junction connector (under lines) -->
  <g>
    <line x1="575" y1="190" x2="575" y2="330" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="7 6" opacity=".8"/>
    <g class="zap" transform="translate(575 260)">
      <circle r="15" fill="#3b1210" stroke="#ff6b6b" stroke-width="2"/>
      <text y="5.5" text-anchor="middle" font-size="14">⚡</text>
    </g>
    <text x="575" y="243" text-anchor="middle" font-size="11.5" class="mono" fill="#ff9c9c">both lines touch storage.ts</text>
    <text x="575" y="292" text-anchor="middle" font-size="11.5" fill="#ff9c9c">conflict junction</text>
  </g>

  <!-- LINE A (mango) -->
  <path d="M120,190 H660 L725,255 H846" fill="none" stroke="url(#mango)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- LINE B (teal) -->
  <path d="M120,330 H660 L725,265 H846" fill="none" stroke="#55d8c7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- YOUR LINE (purple) to merge -->
  <path d="M890,260 H1080" fill="none" stroke="#a371f7" stroke-width="9" stroke-linecap="round"/>

  <!-- stations on A -->
  <g stroke="#ff7b1c" stroke-width="3.5" fill="#e8fffa">
    <circle cx="120" cy="190" r="9"/><circle cx="260" cy="190" r="7"/><circle cx="400" cy="190" r="7"/>
    <circle cx="540" cy="190" r="7"/><circle cx="645" cy="190" r="7"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <use href="#gh" transform="translate(56 150) scale(0.6)" fill="#ffd08a"/>
    <text x="120" y="164" font-weight="800" fill="#ffd08a">ISSUE #12</text>
    <text x="120" y="150" font-size="11" class="dim">overdue filter</text>
    <text x="260" y="168" class="muted">spec</text>
    <text x="400" y="168" class="muted">branch</text>
    <text x="540" y="168" class="muted">commits</text>
    <text x="645" y="168" class="muted">PR #21</text>
  </g>

  <!-- stations on B -->
  <g stroke="#2bb3a0" stroke-width="3.5" fill="#e8fffa">
    <circle cx="120" cy="330" r="9"/><circle cx="260" cy="330" r="7"/><circle cx="400" cy="330" r="7"/>
    <circle cx="540" cy="330" r="7"/><circle cx="645" cy="330" r="7"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <use href="#gh" transform="translate(56 348) scale(0.6)" fill="#8ef0e0"/>
    <text x="120" y="362" font-weight="800" fill="#8ef0e0">ISSUE #13</text>
    <text x="120" y="377" font-size="11" class="dim">sort by due date</text>
    <text x="260" y="357" class="muted">spec</text>
    <text x="400" y="357" class="muted">branch</text>
    <text x="540" y="357" class="muted">commits</text>
    <text x="645" y="357" class="muted">PR #22</text>
  </g>

  <!-- REVIEW interchange -->
  <g transform="translate(868 260)">
    <g class="youPulse">
      <circle r="24" fill="#e8fffa"/>
      <circle r="24" fill="none" stroke="#a371f7" stroke-width="5"/>
      <circle r="15" fill="#07231f"/>
      <text y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#e8fffa">YOU</text>
    </g>
    <text y="-40" text-anchor="middle" font-size="13.5" font-weight="800" fill="#a371f7">REVIEW INTERCHANGE</text>
    <text y="52" text-anchor="middle" font-size="12" class="muted">rubric · comments · approval</text>
    <g class="cyc wait" transform="translate(0 -68)">
      <rect x="-77" y="-14" width="154" height="26" rx="13" fill="#3b1210" stroke="#ff6b6b" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="12" fill="#ff9c9c" font-weight="700">+2 trains waiting on you</text>
    </g>
  </g>

  <!-- MERGE terminus -->
  <g transform="translate(1080 260)">
    <rect x="-11" y="-11" width="22" height="22" rx="5" fill="#e8fffa" stroke="#a371f7" stroke-width="4"/>
    <text y="-26" text-anchor="middle" font-size="13" font-weight="800" fill="#a371f7">MERGE</text>
    <text y="36" text-anchor="middle" font-size="12">🎉</text>
    <g class="cyc mA"><text x="0" y="-46" text-anchor="middle" font-size="12" fill="#7ee2a8" class="mono">#21 ✓</text></g>
    <g class="cyc mB"><text x="34" y="-26" font-size="12" fill="#7ee2a8" class="mono">#22 ✓</text></g>
  </g>

  <!-- trains -->
  <g filter="url(#glow)">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0.76;0.76;1;1" keyTimes="0;0.33;0.52;0.68;1"
      path="M120,190 H660 L725,255 H846 L890,260 H1080"/>
    <circle r="10" fill="url(#mango)"/><use href="#cp" transform="translate(-6.5 -6.5) scale(0.54)" fill="#3a1c00"/>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0.76;0.76;1;1" keyTimes="0;0.45;0.82;0.95;1"
      path="M120,330 H660 L725,265 H846 L890,260 H1080"/>
    <circle r="10" fill="#55d8c7"/><use href="#cp" transform="translate(-6.5 -6.5) scale(0.54)" fill="#043c34"/>
  </g>

  <!-- legend -->
  <g transform="translate(60 455)" font-size="12">
    <rect x="-18" y="-20" width="360" height="92" rx="10" fill="#02100e" stroke="#1d5b52"/>
    <line x1="0" y1="0" x2="34" y2="0" stroke="#ffa653" stroke-width="7" stroke-linecap="round"/>
    <use href="#cp" transform="translate(44 -8) scale(0.66)" fill="#ffd08a"/>
    <text x="66" y="4" class="muted">agent line · task #12</text>
    <line x1="0" y1="26" x2="34" y2="26" stroke="#55d8c7" stroke-width="7" stroke-linecap="round"/>
    <use href="#cp" transform="translate(44 18) scale(0.66)" fill="#8ef0e0"/>
    <text x="66" y="30" class="muted">agent line · task #13</text>
    <line x1="0" y1="52" x2="34" y2="52" stroke="#a371f7" stroke-width="7" stroke-linecap="round"/>
    <text x="46" y="56" class="muted">your review path — the only shared track</text>
  </g>

  <!-- takeaway -->
  <text x="740" y="490" font-size="14.5" class="muted">Partition tasks by <tspan fill="#8ef0e0" font-weight="700">file boundaries</tspan>, not feature vibes —</text>
  <text x="740" y="514" font-size="14.5" class="muted">shared files become <tspan fill="#ff9c9c" font-weight="700">conflict junctions</tspan>.</text>
  </g>
  <rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#1d5b52" stroke-width="2"/>
</svg>
