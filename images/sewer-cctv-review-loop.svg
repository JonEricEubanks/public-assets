<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="100%"><stop offset="0%" stop-color="#16283d"/><stop offset="55%" stop-color="#0b1726"/><stop offset="100%" stop-color="#050b13"/></radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b8d8f5"/><stop offset="100%" stop-color="#3f7fcf"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8cbcea"/><stop offset="100%" stop-color="#4a86c5"/></linearGradient>
    <radialGradient id="tube" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#01040a"/><stop offset="35%" stop-color="#07121f"/><stop offset="100%" stop-color="#1f3e63"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".35"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="aM" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#6aa9ec"/></marker>
    <marker id="aD" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#5b7390"/></marker>
    <clipPath id="thumb"><rect x="24" y="52" width="190" height="134" rx="10"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="480" rx="22"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
    .muted{fill:#93a9c2}.dim{fill:#5b7390}
    .conf{animation:conf 12s ease-out infinite}
    @keyframes conf{0%,4%{width:0}16%{width:164px}100%{width:164px}}
    .box{animation:box 12s linear infinite}
    @keyframes box{0%,6%{opacity:0}10%{opacity:1}100%{opacity:1}}
    .d{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;opacity:0}
    .d1{animation-name:d1}.d2{animation-name:d2}.d3{animation-name:d3}.d4{animation-name:d4}.d5{animation-name:d5}
    @keyframes d1{0%,18%{opacity:0}22%,32%{opacity:.5}36%,100%{opacity:0}}
    @keyframes d2{0%,34%{opacity:0}38%,48%{opacity:.5}52%,100%{opacity:0}}
    @keyframes d3{0%,50%{opacity:0}54%,64%{opacity:.5}68%,100%{opacity:0}}
    @keyframes d4{0%,66%{opacity:0}70%,80%{opacity:.5}84%,100%{opacity:0}}
    @keyframes d5{0%,82%{opacity:0}86%,96%{opacity:.5}99%,100%{opacity:0}}
    .rec{animation:rec 1.4s steps(1) infinite}@keyframes rec{0%{opacity:1}50%{opacity:.2}}
    [class]{animation-fill-mode:both}
  </style>

  <g clip-path="url(#frame)" fill="#eaf1f8">
  <rect width="1200" height="480" fill="url(#bg)"/>

  <text x="64" y="52" font-size="13" letter-spacing="4" class="dim mono">DECISION 02 · A HUMAN ON EVERY FINDING</text>
  <text x="64" y="86" font-size="25" font-weight="900">AI proposes. <tspan fill="url(#mango)">A person disposes.</tspan></text>
  <text x="1136" y="52" text-anchor="end" font-size="11.5" class="mono dim">5 dispositions · 1 audit trail</text>

  <!-- ===== AI card ===== -->
  <g transform="translate(64 116)">
    <rect width="480" height="236" rx="16" fill="#0d1d30" stroke="#3d6fa3" stroke-width="2" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="10" letter-spacing="2" font-weight="800" fill="#5b9bd5">AI CLASSIFICATION</text>

    <!-- keyframe thumbnail -->
    <rect x="24" y="52" width="190" height="134" rx="10" fill="#03070d"/>
    <g clip-path="url(#thumb)">
      <circle cx="119" cy="119" r="64" fill="url(#tube)"/>
      <g fill="none" stroke="#3a5f8a">
        <circle cx="119" cy="119" r="47" stroke-width="1.8" opacity=".6"/><circle cx="119" cy="119" r="33" stroke-width="1.4" opacity=".45"/>
        <circle cx="119" cy="119" r="23" stroke-width="1.1" opacity=".32"/><circle cx="119" cy="119" r="15" stroke-width="1" opacity=".22"/>
      </g>
      <path d="M78 164 L111 128 L127 128 L160 164 L160 190 L78 190 Z" fill="#0f2440"/>
      <path d="M90 66 L96 74 L92 80 L100 88 L97 96" stroke="#ef8a7a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="box"><rect x="84" y="60" width="22" height="42" rx="2" fill="none" stroke="#ef8a7a" stroke-width="1.4" stroke-dasharray="4 3"/></g>
    </g>
    <rect x="32" y="164" width="64" height="16" rx="4" fill="#03070d" opacity=".8"/>
    <text x="64" y="176" text-anchor="middle" font-size="9" letter-spacing="1.5" class="mono" fill="#8cbcea">KEYFRAME</text>
    <rect x="148" y="164" width="60" height="16" rx="4" fill="#03070d" opacity=".85"/>
    <text x="178" y="176" text-anchor="middle" font-size="9.5" class="mono" fill="#d3e2f2">00:12:34</text>

    <!-- details -->
    <text x="236" y="72" font-size="15" font-weight="700">Fracture · longitudinal</text>
    <g font-size="11.5" class="mono muted">
      <text x="236" y="96">12 o'clock · crown</text>
      <text x="236" y="116">00:12:34 → 00:12:41</text>
      <text x="236" y="136">footage 127.5 ft</text>
    </g>
    <text x="236" y="160" font-size="10" letter-spacing="1.5" font-weight="700" class="dim">CONFIDENCE</text>
    <rect x="236" y="168" width="180" height="10" rx="5" fill="#081424" stroke="#22384f"/>
    <rect class="conf" x="236" y="168" width="164" height="10" rx="5" fill="url(#teal)"/>
    <text x="424" y="177" font-size="11.5" font-weight="700" class="mono" fill="#8cbcea">91%</text>

    <rect x="24" y="200" width="432" height="22" rx="11" fill="#081424"/>
    <text x="240" y="215" text-anchor="middle" font-size="10" class="mono dim">original extraction · read only · nearest keyframe</text>
  </g>

  <!-- handoff arrow -->
  <path d="M552 234 L646 234" stroke="#6aa9ec" stroke-width="2.5" fill="none" marker-end="url(#aM)"/>
  <text x="599" y="224" text-anchor="middle" font-size="10" letter-spacing="2" font-weight="800" fill="#b8d8f5">REVIEW</text>
  <circle r="4.5" fill="#b8d8f5" filter="url(#glow)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M552 234 L640 234"/></circle>

  <!-- ===== Human card ===== -->
  <g transform="translate(656 116)">
    <rect width="480" height="236" rx="16" fill="#0d1d30" stroke="url(#mango)" stroke-width="2" filter="url(#shadow)"/>
    <text x="24" y="34" font-size="10" letter-spacing="2" font-weight="800" fill="#b8d8f5">HUMAN REVIEW</text>
    <g class="rec"><circle cx="252" cy="30" r="3.5" fill="#ec6a5e"/></g>
    <text x="456" y="34" text-anchor="end" font-size="10.5" class="mono dim">video cued to 00:12:34</text>

    <g font-size="12.5" font-weight="700" text-anchor="middle">
      <!-- Confirmed -->
      <rect x="24" y="56" width="136" height="36" rx="18" fill="#6aa9ec" fill-opacity=".14" stroke="#6aa9ec" stroke-width="1.4"/>
      <rect class="d d1" x="24" y="56" width="136" height="36" rx="18" fill="#6aa9ec" filter="url(#glow)"/>
      <text x="92" y="79" fill="#cfe3fa">Confirmed</text>
      <!-- Corrected -->
      <rect x="172" y="56" width="136" height="36" rx="18" fill="#9dbbe8" fill-opacity=".14" stroke="#9dbbe8" stroke-width="1.4"/>
      <rect class="d d2" x="172" y="56" width="136" height="36" rx="18" fill="#9dbbe8" filter="url(#glow)"/>
      <text x="240" y="79" fill="#d2e1f5">Corrected</text>
      <!-- Rejected -->
      <rect x="320" y="56" width="136" height="36" rx="18" fill="#ec8c80" fill-opacity=".14" stroke="#ec8c80" stroke-width="1.4"/>
      <rect class="d d3" x="320" y="56" width="136" height="36" rx="18" fill="#ec8c80" filter="url(#glow)"/>
      <text x="388" y="79" fill="#f6c9c3">Rejected</text>
      <!-- Duplicate -->
      <rect x="24" y="104" width="210" height="36" rx="18" fill="#a9b2b9" fill-opacity=".12" stroke="#a9b2b9" stroke-width="1.4"/>
      <rect class="d d4" x="24" y="104" width="210" height="36" rx="18" fill="#a9b2b9" filter="url(#glow)"/>
      <text x="129" y="127" fill="#dde2e5">Duplicate</text>
      <!-- Unable to Verify -->
      <rect x="246" y="104" width="210" height="36" rx="18" fill="#7d8ea8" fill-opacity=".12" stroke="#7d8ea8" stroke-width="1.4"/>
      <rect class="d d5" x="246" y="104" width="210" height="36" rx="18" fill="#7d8ea8" filter="url(#glow)"/>
      <text x="351" y="127" fill="#d5dde8">Unable to Verify</text>
    </g>

    <text x="24" y="170" font-size="11.5" class="mono muted">+ reviewer notes · corrected fields</text>
    <rect x="24" y="186" width="432" height="36" rx="18" fill="#0f2238" stroke="#6aa9ec" stroke-width="1.2"/>
    <text x="240" y="209" text-anchor="middle" font-size="11.5" class="mono" fill="#b8d8f5">disposition + reviewer + timestamp → SharePoint</text>
  </g>

  <!-- ===== outcome rail ===== -->
  <g font-size="12" class="mono" text-anchor="middle">
    <rect x="155" y="376" width="170" height="36" rx="18" fill="#0c1a2b" stroke="#22384f"/>
    <text x="240" y="399" fill="#8cbcea">AI first pass</text>
    <rect x="395" y="376" width="170" height="36" rx="18" fill="#0f2238" stroke="#6aa9ec"/>
    <text x="480" y="399" fill="#b8d8f5">human disposition</text>
    <rect x="635" y="376" width="170" height="36" rx="18" fill="#0c1a2b" stroke="#22384f"/>
    <text x="720" y="399" fill="#d3e2f2">audit trail</text>
    <rect x="875" y="376" width="170" height="36" rx="18" fill="#0c1a2b" stroke="#22384f"/>
    <text x="960" y="399" fill="#6aa9ec">calibration signal</text>
  </g>
  <g stroke="#5b7390" stroke-width="2" fill="none" marker-end="url(#aD)">
    <path d="M327 394 L391 394"/><path d="M567 394 L631 394"/><path d="M807 394 L871 394"/>
  </g>

  <text x="600" y="450" text-anchor="middle" font-size="14.5" class="muted">The model does the watching. The inspector does the judging.</text>
  </g>
  <rect x="1" y="1" width="1198" height="478" rx="21" fill="none" stroke="#22384f" stroke-width="2"/>
</svg>
