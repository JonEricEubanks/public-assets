<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="760" height="460" fill="#F8FAFC" rx="16"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Copilot Credit Usage</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#94A3B8">Power Platform admin center  ·  Environments overview</text>

  <!-- ══ ENVIRONMENT A ══ -->
  <rect x="36" y="76" width="688" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="60" y="104" font-size="13" font-weight="700" fill="#0F172A">Production environment</text>
  <rect x="60" y="112" width="58" height="16" rx="8" fill="#DBEAFE"/>
  <text x="89" y="124" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1D4ED8">ACTIVE</text>

  <!-- Credit allocation label -->
  <text x="60" y="150" font-size="11.5" fill="#6B7280">Copilot Credits used</text>
  <text x="608" y="150" text-anchor="end" font-size="11.5" font-weight="600" fill="#0F172A">6,240 of 25,000</text>

  <!-- Progress bar track -->
  <rect x="60" y="158" width="548" height="12" rx="6" fill="#F1F5F9"/>
  <!-- Progress fill: 6240/25000 ≈ 25% -->
  <rect x="60" y="158" width="137" height="12" rx="6" fill="#0078D4"/>

  <!-- Percentage label -->
  <text x="624" y="169" font-size="11" fill="#6B7280">25%</text>

  <!-- Breakdown row -->
  <text x="60"  y="196" font-size="11" fill="#94A3B8">Conversational</text>
  <text x="280" y="196" font-size="11" fill="#374151" font-weight="500">3,100 credits</text>
  <text x="400" y="196" font-size="11" fill="#94A3B8">Build &amp; test</text>
  <text x="570" y="196" font-size="11" fill="#374151" font-weight="500">3,140 credits</text>

  <!-- ══ ENVIRONMENT B ══ -->
  <rect x="36" y="222" width="688" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="60" y="250" font-size="13" font-weight="700" fill="#0F172A">Development environment</text>
  <rect x="60" y="258" width="58" height="16" rx="8" fill="#DCFCE7"/>
  <text x="89" y="270" text-anchor="middle" font-size="9.5" font-weight="600" fill="#15803D">ACTIVE</text>

  <text x="60" y="296" font-size="11.5" fill="#6B7280">Copilot Credits used</text>
  <text x="608" y="296" text-anchor="end" font-size="11.5" font-weight="600" fill="#0F172A">1,850 of 10,000</text>

  <rect x="60" y="304" width="548" height="12" rx="6" fill="#F1F5F9"/>
  <!-- 1850/10000 ≈ 18.5% -->
  <rect x="60" y="304" width="101" height="12" rx="6" fill="#16A34A"/>

  <text x="624" y="315" font-size="11" fill="#6B7280">19%</text>

  <text x="60"  y="342" font-size="11" fill="#94A3B8">Conversational</text>
  <text x="280" y="342" font-size="11" fill="#374151" font-weight="500">900 credits</text>
  <text x="400" y="342" font-size="11" fill="#94A3B8">Build &amp; test</text>
  <text x="570" y="342" font-size="11" fill="#374151" font-weight="500">950 credits</text>

  <!-- ══ REFERENCE TABLE ══ -->
  <rect x="36" y="368" width="688" height="72" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="60" y="390" font-size="12" font-weight="600" fill="#78350F">Credit reference (approx.)</text>

  <text x="60"  y="412" font-size="11.5" fill="#92400E">Lighter conversation</text>
  <text x="272" y="412" font-size="11.5" fill="#374151">100–300 credits</text>
  <text x="420" y="412" font-size="11.5" fill="#6B7280">(~$1–$3)</text>

  <text x="60"  y="430" font-size="11.5" fill="#92400E">Heavier, multi-step work</text>
  <text x="272" y="430" font-size="11.5" fill="#374151">500+ credits</text>
  <text x="420" y="430" font-size="11.5" fill="#6B7280">(~$5+  ·  1 credit ≈ $0.01)</text>

  <!-- Caption -->
  <text x="380" y="454" text-anchor="middle" font-size="10" fill="#CBD5E1" font-style="italic">Administrators can allocate credits per environment and review consumption. Numbers are illustrative.</text>
</svg>
