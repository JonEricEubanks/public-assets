<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="680" height="460" fill="#F1F5F9" rx="16"/>

  <!-- Card -->
  <rect x="36" y="24" width="608" height="420" rx="12" fill="#FFFFFF"/>
  <rect x="36" y="24" width="608" height="52" rx="12" fill="#FFFFFF"/>
  <rect x="36" y="64" width="608" height="12" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="64" y="57" font-size="16" font-weight="700" fill="#0F172A">Choose model</text>
  <line x1="36" y1="76" x2="644" y2="76" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- Subtext -->
  <text x="64" y="102" font-size="12" fill="#64748B">The model you choose is the agent's main brain — it runs the full reasoning loop.</text>

  <!-- Search bar -->
  <rect x="64" y="114" width="552" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="86" y="137" font-size="12" fill="#94A3B8">Search models...</text>

  <!-- ─── OPUS 5 (selected) ─── -->
  <rect x="64" y="160" width="552" height="56" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="80" y="174" width="28" height="28" rx="6" fill="#6D28D9"/>
  <text x="94" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">A</text>
  <text x="120" y="186" font-size="13" font-weight="600" fill="#0F172A">Opus 5</text>
  <text x="120" y="204" font-size="11.5" fill="#475569">Anthropic  ·  Advanced reasoning and complex analysis</text>
  <!-- Radio selected -->
  <circle cx="598" cy="188" r="10" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="598" cy="188" r="5.5" fill="#3B82F6"/>

  <!-- ─── GPT-5.6 ─── -->
  <rect x="64" y="224" width="552" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="80" y="238" width="28" height="28" rx="6" fill="#10A37F"/>
  <text x="94" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">G</text>
  <text x="120" y="250" font-size="13" font-weight="500" fill="#0F172A">GPT-5.6</text>
  <text x="120" y="268" font-size="11.5" fill="#475569">OpenAI  ·  General purpose, multimodal</text>
  <circle cx="598" cy="252" r="10" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- ─── FABLE 5 ─── -->
  <rect x="64" y="288" width="552" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="80" y="302" width="28" height="28" rx="6" fill="#0078D4"/>
  <text x="94" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">F</text>
  <text x="120" y="314" font-size="13" font-weight="500" fill="#0F172A">Fable 5</text>
  <text x="120" y="332" font-size="11.5" fill="#475569">Microsoft  ·  Multimodal, enterprise-optimized</text>
  <circle cx="598" cy="316" r="10" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- ─── GPT-4.1 mini ─── -->
  <rect x="64" y="352" width="552" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="80" y="366" width="28" height="28" rx="6" fill="#6B7280"/>
  <text x="94" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">G</text>
  <text x="120" y="378" font-size="13" font-weight="500" fill="#0F172A">GPT-4.1 mini</text>
  <text x="120" y="396" font-size="11.5" fill="#475569">OpenAI  ·  Lightweight, low-latency</text>
  <circle cx="598" cy="380" r="10" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Footer note -->
  <rect x="64" y="420" width="552" height="16" rx="4" fill="#FFFBEB"/>
  <text x="340" y="432" text-anchor="middle" font-size="10" fill="#92400E">Available models depend on your organization's admin configuration and region.</text>
</svg>
