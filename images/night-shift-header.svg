<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#0f4a42"/>
      <stop offset="52%" stop-color="#052d28"/>
      <stop offset="100%" stop-color="#02100e"/>
    </radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/><stop offset="100%" stop-color="#ff7b1c"/>
    </linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="cres"><rect x="-30" y="-30" width="60" height="60" fill="#fff"/><circle cx="11" cy="-7" r="21" fill="#000"/></mask>
    <path id="gh" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    <path id="cp" d="M23.922 16.997C23.061 18.492 18.063 22.02 12 22.02 5.937 22.02.939 18.492.078 16.997A.641.641 0 0 1 0 16.741v-2.869a.883.883 0 0 1 .053-.22c.372-.935 1.347-2.292 2.605-2.656.167-.429.414-1.055.644-1.517a10.098 10.098 0 0 1-.052-1.086c0-1.331.282-2.499 1.132-3.368.397-.406.89-.717 1.474-.952C7.255 2.937 9.248 1.98 11.978 1.98c2.731 0 4.767.957 6.166 2.093.584.235 1.077.546 1.474.952.85.869 1.132 2.037 1.132 3.368 0 .368-.014.733-.052 1.086.23.462.477 1.088.644 1.517 1.258.364 2.233 1.721 2.605 2.656a.841.841 0 0 1 .053.22v2.869a.641.641 0 0 1-.078.256Zm-11.75-5.992h-.344a4.359 4.359 0 0 1-.355.508c-.77.947-1.918 1.492-3.508 1.492-1.725 0-2.989-.359-3.782-1.259a2.137 2.137 0 0 1-.085-.104L4 11.746v6.585c1.435.779 4.514 2.179 8 2.179 3.486 0 6.565-1.4 8-2.179v-6.585l-.098-.104s-.033.045-.085.104c-.793.9-2.057 1.259-3.782 1.259-1.59 0-2.738-.545-3.508-1.492a4.359 4.359 0 0 1-.355-.508Zm2.328 3.25c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm-5 0c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm3.313-6.185c.136 1.057.403 1.913.878 2.497.442.544 1.134.938 2.344.938 1.573 0 2.292-.337 2.657-.751.384-.435.558-1.15.558-2.361 0-1.14-.243-1.847-.705-2.319-.477-.488-1.319-.862-2.824-1.025-1.487-.161-2.192.138-2.533.529-.269.307-.437.808-.438 1.578v.021c0 .265.021.562.063.893Zm-1.626 0c.042-.331.063-.628.063-.894v-.02c-.001-.77-.169-1.271-.438-1.578-.341-.391-1.046-.69-2.533-.529-1.505.163-2.347.537-2.824 1.025-.462.472-.705 1.179-.705 2.319 0 1.211.175 1.926.558 2.361.365.414 1.084.751 2.657.751 1.21 0 1.902-.394 2.344-.938.475-.584.742-1.44.878-2.497Z"/>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    text{fill:#e8fffa}
    .mono{font-family:'Cascadia Code',Consolas,monospace}
    .muted{fill:#7fbfb4}
    .dim{fill:#4f8f84}
    .tw1,.tw2,.tw3{animation:tw 3.4s ease-in-out infinite}
    .tw2{animation-delay:-1.2s}.tw3{animation-delay:-2.3s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}
    .moonpulse{animation:moonpulse 5s ease-in-out infinite}
    @keyframes moonpulse{0%,100%{opacity:.9}50%{opacity:1}}
    .shoot{animation:shoot 12s linear infinite}
    @keyframes shoot{0%,55%{opacity:0;transform:translate(0,0)}58%{opacity:1}63%{opacity:0;transform:translate(-230px,80px)}100%{opacity:0}}
    .under{stroke-dasharray:1;animation:under 12s linear infinite}
    @keyframes under{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}18%{stroke-dashoffset:0}96%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    .c1{animation:chip 12s linear infinite}
    .c2{animation:chip 12s linear infinite;animation-delay:1.1s}
    .c3{animation:chip 12s linear infinite;animation-delay:2.2s}
    @keyframes chip{0%,18%{opacity:0;transform:translateY(8px)}23%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
    .winb1{animation:winb 6s ease-in-out infinite}
    .winb2{animation:winb 6s ease-in-out infinite;animation-delay:-2.7s}
    @keyframes winb{0%,100%{opacity:.9}50%{opacity:.25}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#8ef0e0">
    <circle class="tw1" cx="120" cy="52" r="1.7"/><circle class="tw2" cx="300" cy="34" r="1.4"/>
    <circle class="tw3" cx="522" cy="58" r="1.6"/><circle class="tw1" cx="700" cy="30" r="1.4"/>
    <circle class="tw2" cx="860" cy="64" r="1.7"/><circle class="tw3" cx="980" cy="36" r="1.4"/>
    <circle class="tw1" cx="1105" cy="90" r="1.5"/><circle class="tw2" cx="640" cy="86" r="1.3"/>
  </g>
  <g class="shoot"><line x1="1010" y1="40" x2="1052" y2="22" stroke="#8ef0e0" stroke-width="1.6" opacity=".85"/></g>

  <!-- crescent mango moon -->
  <g transform="translate(1080 78)"><g class="moonpulse" filter="url(#glow)"><circle r="26" fill="url(#mango)" mask="url(#cres)"/></g></g>

  <!-- skyline strip -->
  <g fill="#041a17">
    <rect x="0" y="238" width="1200" height="62"/>
    <rect x="60" y="196" width="72" height="46"/><rect x="176" y="210" width="52" height="32"/>
    <rect x="300" y="188" width="86" height="54"/><rect x="470" y="214" width="60" height="28"/>
    <rect x="640" y="192" width="78" height="50"/><rect x="800" y="206" width="64" height="36"/>
    <rect x="946" y="184" width="90" height="58"/><rect x="1110" y="212" width="56" height="30"/>
  </g>
  <g fill="#55d8c7">
    <rect class="winb1" x="76" y="208" width="7" height="9" rx="1"/>
    <rect class="winb2" x="326" y="200" width="7" height="9" rx="1"/>
    <rect class="winb1" x="664" y="204" width="7" height="9" rx="1"/>
    <rect class="winb2" x="968" y="196" width="7" height="9" rx="1"/>
    <rect class="winb1" x="1124" y="222" width="7" height="9" rx="1"/>
  </g>

  <!-- marks -->
  <use href="#gh" transform="translate(80 56) scale(1.15)" fill="#7fbfb4"/>
  <use href="#cp" transform="translate(120 56) scale(1.15)" fill="#7fbfb4"/>
  <text x="160" y="76" font-size="14" letter-spacing="4" class="dim mono">A GITHUB COPILOT FIELD REPORT</text>

  <!-- title -->
  <text x="78" y="150" font-size="62" font-weight="900" letter-spacing="1">THE <tspan fill="url(#mango)">NIGHT SHIFT</tspan></text>
  <line class="under" x1="80" y1="170" x2="620" y2="170" stroke="#ff9a3d" stroke-width="3" pathLength="1" stroke-linecap="round"/>
  <text x="80" y="204" font-size="19" class="muted">What happened when I stopped coding and started delegating</text>

  <!-- series chips -->
  <g font-size="13" class="mono">
    <g class="c1">
      <rect x="740" y="180" width="130" height="30" rx="15" fill="#07231f" stroke="#1d5b52"/>
      <text x="805" y="199" text-anchor="middle" fill="#8ef0e0">01 · delegate</text>
    </g>
    <g class="c2">
      <rect x="882" y="180" width="146" height="30" rx="15" fill="#07231f" stroke="#1d5b52"/>
      <text x="955" y="199" text-anchor="middle" fill="#ffd08a">02 · parallelize</text>
    </g>
    <g class="c3">
      <rect x="1040" y="180" width="118" height="30" rx="15" fill="#07231f" stroke="#1d5b52"/>
      <text x="1099" y="199" text-anchor="middle" fill="#7ee2a8">03 · secure</text>
    </g>
  </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#1d5b52" stroke-width="2"/>
</svg>
