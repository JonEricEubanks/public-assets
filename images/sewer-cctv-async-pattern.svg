  <style>
    .mono{font-family:'Cascadia Code','Cascadia Mono',Consolas,'Courier New',monospace}
    .muted{fill:#8bb4d6}.dim{fill:#4f7699}
    .band{animation:band 7s linear infinite}
    @keyframes band{0%{transform:translateY(-160px)}100%{transform:translateY(560px)}}
    .corner{animation:corner 2.4s ease-in-out infinite}
    @keyframes corner{0%,100%{opacity:.35}50%{opacity:1}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:.12}}
    .spin{animation:spin 4s linear infinite;transform-origin:0 0}
    .spin2{animation:spin 2.4s linear infinite;transform-origin:0 0}
    .spinr{animation:spin 9s linear infinite reverse;transform-origin:0 0}
    .spinslow{animation:spin 60s linear infinite;transform-origin:0 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .under{stroke-dasharray:1;animation:under 12s linear infinite}
    @keyframes under{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}18%{stroke-dashoffset:0}94%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    .ping{animation:ping 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping{0%{transform:scale(.2);opacity:1}35%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
    .lock{animation:lock 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes lock{0%{transform:scale(1.9);opacity:0}9%{transform:scale(1);opacity:1}70%{transform:scale(1);opacity:1}88%,100%{transform:scale(1);opacity:.28}}
    .lbl{animation:lbl 4s linear infinite}
    @keyframes lbl{0%{opacity:.3}7%{opacity:1}70%{opacity:1}88%,100%{opacity:.3}}
    .loop{animation:loop 12s ease-in-out infinite}
    @keyframes loop{0.00%{opacity:0.45}25.00%{opacity:0.45}28.00%{opacity:1}76.00%{opacity:1}79.00%{opacity:0.45}100.00%{opacity:0.45}}
    .done{animation:done 12s linear infinite}
    @keyframes done{0.00%{opacity:0.35}77.00%{opacity:0.35}80.00%{opacity:1}99.00%{opacity:1}100.00%{opacity:0.35}}
    .stRun{animation:stRun 12s linear infinite}
    @keyframes stRun{0.00%{opacity:0}16.50%{opacity:0}17.00%{opacity:1}77.00%{opacity:1}77.50%{opacity:0}100.00%{opacity:0}}
    .stOk{animation:stOk 12s linear infinite}
    @keyframes stOk{0.00%{opacity:0}77.50%{opacity:0}78.00%{opacity:1}100.00%{opacity:1}}
    .poll0{animation:poll0 12s linear infinite}
    @keyframes poll0{0.00%{opacity:0}27.99%{opacity:0}28.00%{opacity:1}31.99%{opacity:1}32.00%{opacity:0}100.00%{opacity:0}}
    .poll1{animation:poll1 12s linear infinite}
    @keyframes poll1{0.00%{opacity:0}31.99%{opacity:0}32.00%{opacity:1}35.99%{opacity:1}36.00%{opacity:0}100.00%{opacity:0}}
    .poll2{animation:poll2 12s linear infinite}
    @keyframes poll2{0.00%{opacity:0}35.99%{opacity:0}36.00%{opacity:1}39.99%{opacity:1}40.00%{opacity:0}100.00%{opacity:0}}
    .poll3{animation:poll3 12s linear infinite}
    @keyframes poll3{0.00%{opacity:0}39.99%{opacity:0}40.00%{opacity:1}43.99%{opacity:1}44.00%{opacity:0}100.00%{opacity:0}}
    .poll4{animation:poll4 12s linear infinite}
    @keyframes poll4{0.00%{opacity:0}43.99%{opacity:0}44.00%{opacity:1}47.99%{opacity:1}48.00%{opacity:0}100.00%{opacity:0}}
    .poll5{animation:poll5 12s linear infinite}
    @keyframes poll5{0.00%{opacity:0}47.99%{opacity:0}48.00%{opacity:1}51.99%{opacity:1}52.00%{opacity:0}100.00%{opacity:0}}
    .poll6{animation:poll6 12s linear infinite}
    @keyframes poll6{0.00%{opacity:0}51.99%{opacity:0}52.00%{opacity:1}55.99%{opacity:1}56.00%{opacity:0}100.00%{opacity:0}}
    .poll7{animation:poll7 12s linear infinite}
    @keyframes poll7{0.00%{opacity:0}55.99%{opacity:0}56.00%{opacity:1}59.99%{opacity:1}60.00%{opacity:0}100.00%{opacity:0}}
    .poll8{animation:poll8 12s linear infinite}
    @keyframes poll8{0.00%{opacity:0}59.99%{opacity:0}60.00%{opacity:1}63.99%{opacity:1}64.00%{opacity:0}100.00%{opacity:0}}
    .poll9{animation:poll9 12s linear infinite}
    @keyframes poll9{0.00%{opacity:0}63.99%{opacity:0}64.00%{opacity:1}67.99%{opacity:1}68.00%{opacity:0}100.00%{opacity:0}}
    .poll10{animation:poll10 12s linear infinite}
    @keyframes poll10{0.00%{opacity:0}67.99%{opacity:0}68.00%{opacity:1}71.99%{opacity:1}72.00%{opacity:0}100.00%{opacity:0}}
