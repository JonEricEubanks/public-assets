<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="100%"><stop offset="0%" stop-color="#16283d"/><stop offset="55%" stop-color="#0b1726"/><stop offset="100%" stop-color="#050b13"/></radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b8d8f5"/><stop offset="100%" stop-color="#3f7fcf"/></linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="aT" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#5b9bd5"/></marker>
    <marker id="aA" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#b8d8f5"/></marker>
    <marker id="aD" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#5b7390"/></marker>
    <marker id="aG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#6aa9ec"/></marker>
    <clipPath id="frame"><rect width="1200" height="480" rx="22"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
    .muted{fill:#93a9c2}.dim{fill:#5b7390}
    .loop{animation:loop 12s ease-in-out infinite}
    @keyframes loop{0%,26%{opacity:.45}30%,74%{opacity:1}78%,100%{opacity:.45}}
    .done{animation:done 12s ease-in-out infinite}
    @keyframes done{0%,79%{opacity:.35}83%,100%{opacity:1}}
    [class]{animation-fill-mode:both}
  </style>

  <g clip-path="url(#frame)" fill="#eaf1f8">
  <rect width="1200" height="480" fill="url(#bg)"/>

  <text x="64" y="52" font-size="13" letter-spacing="4" class="dim mono">DECISION 01 · ASYNC BY DEFAULT</text>
  <text x="64" y="86" font-size="25" font-weight="900">Power Automate already knows how to wait. <tspan fill="#5b9bd5">Tell it how long.</tspan></text>
  <text x="1136" y="52" text-anchor="end" font-size="11.5" class="mono dim">202 Accepted · Location · Retry-After</text>

  <!-- lane headers -->
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="90" y="108" width="220" height="38" rx="19" fill="#0c1a2b" stroke="#9dbbe8" stroke-width="1.5"/>
    <text x="200" y="132" fill="#9dbbe8">Power Automate</text>
    <rect x="490" y="108" width="220" height="38" rx="19" fill="#0c1a2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="600" y="132" fill="#5b9bd5">Function App</text>
    <rect x="890" y="108" width="220" height="38" rx="19" fill="#0c1a2b" stroke="#b8d8f5" stroke-width="1.5"/>
    <text x="1000" y="132" fill="#b8d8f5">Content Understanding</text>
  </g>
  <g stroke="#22384f" stroke-width="2" stroke-dasharray="2 5">
    <line x1="200" y1="146" x2="200" y2="380"/><line x1="600" y1="146" x2="600" y2="392"/><line x1="1000" y1="146" x2="1000" y2="392"/>
  </g>

  <!-- submit -->
  <g font-size="11.5" class="mono" text-anchor="middle">
    <path d="M200 172 L596 172" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#aT)"/>
    <text x="400" y="165" fill="#d3e2f2">POST /analyze-inspection</text>
    <path d="M600 198 L996 198" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#aT)"/>
    <text x="800" y="191" fill="#d3e2f2">POST :analyze  (read-only SAS url)</text>
    <path d="M600 224 L204 224" stroke="#b8d8f5" stroke-width="2" fill="none" marker-end="url(#aA)"/>
    <text x="400" y="217" fill="#b8d8f5">202 Accepted · Location · Retry-After: 10</text>
  </g>

  <!-- poll loop -->
  <g class="loop">
    <rect x="140" y="240" width="920" height="100" rx="14" fill="#0d1d30" stroke="#3d6fa3" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="160" y="259" font-size="10" letter-spacing="2" font-weight="800" fill="#5b9bd5">LOOP · EVERY ~10 s · THE HTTP ACTION DOES THIS FOR YOU</text>
    <g font-size="11" class="mono" text-anchor="middle">
      <path d="M200 280 L596 280" stroke="#5b7390" stroke-width="1.6" fill="none" marker-end="url(#aD)"/>
      <text x="400" y="274" class="muted">GET /analysis-status</text>
      <path d="M600 302 L996 302" stroke="#5b7390" stroke-width="1.6" fill="none" marker-end="url(#aD)"/>
      <text x="800" y="296" class="muted">GET operation → running</text>
      <path d="M600 324 L204 324" stroke="#5b7390" stroke-width="1.6" fill="none" marker-end="url(#aD)"/>
      <text x="400" y="318" class="muted">202 · still running</text>
    </g>
  </g>

  <!-- result -->
  <g class="done">
    <path d="M600 364 L204 364" stroke="#6aa9ec" stroke-width="2.6" fill="none" marker-end="url(#aG)"/>
    <text x="400" y="356" text-anchor="middle" font-size="12" font-weight="700" class="mono" fill="#6aa9ec">200 OK · findings + thumbnails + videoUrl</text>
    <rect x="110" y="378" width="180" height="26" rx="13" fill="#0c1a2b" stroke="#6aa9ec"/>
    <text x="200" y="395" text-anchor="middle" font-size="11" class="mono" fill="#6aa9ec">Parse JSON → SharePoint</text>
  </g>

  <!-- packets -->
  <g filter="url(#glow)">
    <circle r="5" fill="#5b9bd5" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M200 172 L596 172" keyPoints="0;0;1;1" keyTimes="0;.02;.10;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.019;.02;.10;.101;1"/></circle>
    <circle r="5" fill="#5b9bd5" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M600 198 L996 198" keyPoints="0;0;1;1" keyTimes="0;.10;.17;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.099;.10;.17;.171;1"/></circle>
    <circle r="5" fill="#b8d8f5" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M600 224 L204 224" keyPoints="0;0;1;1" keyTimes="0;.17;.26;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.169;.17;.26;.261;1"/></circle>

    <circle r="4" fill="#93a9c2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M200 280 L596 280" keyPoints="0;0;1;1" keyTimes="0;.30;.36;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.299;.30;.36;.361;1"/></circle>
    <circle r="4" fill="#93a9c2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M600 302 L996 302" keyPoints="0;0;1;1" keyTimes="0;.36;.42;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.359;.36;.42;.421;1"/></circle>
    <circle r="4" fill="#93a9c2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M600 324 L204 324" keyPoints="0;0;1;1" keyTimes="0;.42;.48;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.419;.42;.48;.481;1"/></circle>

    <circle r="4" fill="#93a9c2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M200 280 L596 280" keyPoints="0;0;1;1" keyTimes="0;.54;.60;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.539;.54;.60;.601;1"/></circle>
    <circle r="4" fill="#93a9c2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M600 302 L996 302" keyPoints="0;0;1;1" keyTimes="0;.60;.66;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.599;.60;.66;.661;1"/></circle>
    <circle r="4" fill="#93a9c2" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M600 324 L204 324" keyPoints="0;0;1;1" keyTimes="0;.66;.72;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.659;.66;.72;.721;1"/></circle>

    <circle r="6" fill="#6aa9ec" opacity="0"><animateMotion dur="12s" repeatCount="indefinite" path="M600 364 L204 364" keyPoints="0;0;1;1" keyTimes="0;.78;.88;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.779;.78;.88;.881;1"/></circle>
  </g>

  <!-- the lesson -->
  <g transform="translate(330 406)">
    <rect width="806" height="52" rx="14" fill="#0f2238" stroke="url(#mango)" stroke-width="1.8"/>
    <text x="22" y="22" font-size="13" font-weight="800" fill="#b8d8f5">The pattern is free. The patience is not.</text>
    <text x="22" y="40" font-size="11.5" class="mono" fill="#b8cde6">HTTP action timeout PT10M gave up on long footage → raise it to PT1H, or poll in a Do Until loop</text>
  </g>
  </g>
  <rect x="1" y="1" width="1198" height="478" rx="21" fill="none" stroke="#22384f" stroke-width="2"/>
</svg>
