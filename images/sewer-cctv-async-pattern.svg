    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#cfeeff"/><stop offset="55%" stop-color="#38b6ff"/><stop offset="100%" stop-color="#1f6fd1"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e9e0ff"/><stop offset="55%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c5cf0"/></linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38b6ff" stop-opacity="0"/><stop offset="85%" stop-color="#38b6ff" stop-opacity=".09"/><stop offset="100%" stop-color="#8fd6ff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="gLaser" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38b6ff" stop-opacity="0"/><stop offset="100%" stop-color="#8fd6ff" stop-opacity=".35"/></linearGradient>
