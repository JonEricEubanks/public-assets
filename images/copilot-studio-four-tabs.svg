<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="920" height="420" fill="#F8FAFC" rx="16"/>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Authoring Surface: Before and After</text>

  <!-- ════════════ LEFT PANEL — 9 tabs (Before) ════════════ -->
  <rect x="36" y="56" width="336" height="330" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="36" y="56" width="336" height="44" rx="10" fill="#F3F4F6"/>
  <rect x="36" y="88" width="336" height="12" fill="#F3F4F6"/>
  <text x="204" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">Standard Harness</text>

  <!-- Tabs as sidebar items (9) -->
  <rect x="36" y="100" width="336" height="30" fill="#EFF6FF"/>
  <rect x="36" y="100" width="4" height="30" rx="2" fill="#3B82F6"/>
  <text x="56" y="120" font-size="12" font-weight="600" fill="#1D4ED8">Topics</text>

  <rect x="36" y="130" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="149" font-size="12" fill="#374151">Triggers</text>

  <rect x="36" y="158" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="177" font-size="12" fill="#374151">Entities</text>

  <rect x="36" y="186" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="205" font-size="12" fill="#374151">Variables</text>

  <rect x="36" y="214" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="233" font-size="12" fill="#374151">Authentication</text>

  <rect x="36" y="242" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="261" font-size="12" fill="#374151">Connections</text>

  <rect x="36" y="270" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="289" font-size="12" fill="#374151">Security</text>

  <rect x="36" y="298" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="317" font-size="12" fill="#374151">Analytics</text>

  <rect x="36" y="326" width="336" height="28" fill="#FFFFFF"/>
  <text x="56" y="345" font-size="12" fill="#374151">Publishing</text>

  <!-- "9 tabs" badge -->
  <rect x="300" y="356" width="62" height="22" rx="11" fill="#F3F4F6"/>
  <text x="331" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">9 tabs</text>

  <!-- ════════════ CENTER ARROW ════════════ -->
  <rect x="390" y="208" width="140" height="28" rx="14" fill="#F1F5F9"/>
  <text x="460" y="226" text-anchor="middle" font-size="10.5" fill="#94A3B8" letter-spacing="0.5">consolidated to</text>
  <path d="M 534 222 L 548 222" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <polygon points="544,217 552,222 544,227" fill="#94A3B8"/>

  <!-- ════════════ RIGHT PANEL — 4 tabs (After) ════════════ -->
  <rect x="548" y="56" width="336" height="330" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="548" y="56" width="336" height="44" rx="10" fill="#F0FDF4"/>
  <rect x="548" y="88" width="336" height="12" fill="#F0FDF4"/>
  <text x="716" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">GitHub Copilot Harness</text>

  <!-- Horizontal tab bar -->
  <rect x="548" y="100" width="336" height="40" fill="#F8FAFC"/>
  <line x1="548" y1="140" x2="884" y2="140" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Active: Build -->
  <rect x="556" y="104" width="68" height="32" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <rect x="556" y="136" width="68" height="4" fill="#0078D4" rx="2"/>
  <text x="590" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">Build</text>

  <!-- Preview -->
  <rect x="632" y="108" width="72" height="24" rx="4" fill="transparent"/>
  <text x="668" y="124" text-anchor="middle" font-size="12" fill="#64748B">Preview</text>

  <!-- Evaluate -->
  <rect x="712" y="108" width="76" height="24" rx="4" fill="transparent"/>
  <text x="750" y="124" text-anchor="middle" font-size="12" fill="#64748B">Evaluate</text>

  <!-- Monitor -->
  <rect x="796" y="108" width="74" height="24" rx="4" fill="transparent"/>
  <text x="833" y="124" text-anchor="middle" font-size="12" fill="#64748B">Monitor</text>

  <!-- Content area (Build tab) -->
  <rect x="564" y="152" width="304" height="96" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="716" y="176" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">Agent Instructions</text>
  <rect x="580" y="188" width="272" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="580" y="204" width="220" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="580" y="220" width="248" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="580" y="236" width="180" height="8" rx="4" fill="#E5E7EB"/>

  <!-- Skills card -->
  <rect x="564" y="260" width="146" height="60" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="637" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">Skills</text>
  <text x="637" y="302" text-anchor="middle" font-size="10.5" fill="#0078D4">+ Add skill</text>

  <!-- Knowledge card -->
  <rect x="722" y="260" width="146" height="60" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="795" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">Knowledge</text>
  <text x="795" y="302" text-anchor="middle" font-size="10.5" fill="#0078D4">+ Add source</text>

  <!-- "4 tabs" badge -->
  <rect x="818" y="356" width="58" height="22" rx="11" fill="#DCFCE7"/>
  <text x="847" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#15803D">4 tabs</text>

  <!-- Caption -->
  <text x="460" y="408" text-anchor="middle" font-size="11" fill="#CBD5E1" font-style="italic">Nine configuration tabs became four. Evaluate moves into the primary surface.</text>
</svg>
