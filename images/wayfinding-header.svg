      <path d="M520 410 Q 545 378 570 410 Z"/><path d="M640 412 Q 665 374 690 412 Z"/><path d="M760 410 Q 790 370 820 410 Z"/>
      <path d="M920 412 Q 950 376 980 412 Z"/><path d="M1060 412 Q 1090 372 1120 412 Z"/>
    </g>

    <g transform="translate(0 70)">
    <rect x="70" y="28" width="20" height="390" fill="url(#post)"/><rect x="1110" y="28" width="20" height="390" fill="url(#post)"/>
