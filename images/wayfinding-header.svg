    <rect x="58" y="24" width="1084" height="28" fill="url(#trussP)" opacity=".72"/>
    <path d="M58 24.5 H1142" stroke="#c9c4d1" stroke-width="1" opacity=".5"/>
    <g fill="#1a171f"><rect x="180" y="52" width="9" height="20"/><rect x="460" y="52" width="9" height="20"/><rect x="740" y="52" width="9" height="20"/><rect x="1020" y="52" width="9" height="20"/></g>
    <g class="beacon"><circle cx="78" cy="16" r="26" fill="url(#beacon)"/></g>
    <g class="beacon" style="animation-delay:-.65s"><circle cx="1120" cy="16" r="26" fill="url(#beacon)"/></g>

    <g transform="translate(15 0) scale(.94 1)">
    <g filter="url(#blur)"><rect x="82" y="86" width="372" height="252" rx="18" fill="#053324" opacity=".5"/></g>
    <rect x="82" y="86" width="372" height="252" rx="18" fill="url(#sign)" opacity=".98"/>
    <rect x="88" y="92" width="360" height="240" rx="14" fill="none" stroke="#eef6f1" stroke-width="2.4"/>
    <path d="M94 87 H440" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
    <g fill="#c9d4cc"><circle cx="100" cy="104" r="2.2"/><circle cx="436" cy="104" r="2.2"/><circle cx="100" cy="316" r="2.2"/><circle cx="436" cy="316" r="2.2"/></g>
    <text x="112" y="132" font-size="13.5" letter-spacing="2.8" fill="#c8ecd8">AZURE SERVICES · EXIT 1</text>
    <text x="112" y="186" font-size="46" font-weight="600" letter-spacing="-1" fill="#fff">Static Web Apps</text>
    <text x="112" y="218" font-size="19" font-weight="400" fill="#e0f2e8">React SPA · global edge</text>
    <text x="112" y="246" font-size="17" font-weight="400" fill="#c8e6d5">deep links fall back to the app</text>
    <text x="112" y="274" font-size="17" font-weight="400" fill="#c8e6d5">security headers in config</text>
    <text x="112" y="302" font-size="17" font-weight="400" fill="#c8e6d5">deployed with the SWA CLI</text>
    <g clip-path="url(#cSign)"><g class="sheen"><rect x="-240" y="60" width="150" height="300" fill="url(#sheenG)" transform="skewX(-22)"/></g></g>

    <g filter="url(#blur)"><rect x="466" y="86" width="372" height="252" rx="18" fill="#053324" opacity=".5"/></g>
    <rect x="466" y="86" width="372" height="252" rx="18" fill="url(#sign)" opacity=".98"/>
    <rect x="472" y="92" width="360" height="240" rx="14" fill="none" stroke="#eef6f1" stroke-width="2.4"/>
    <path d="M478 87 H824" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
    <g fill="#c9d4cc"><circle cx="484" cy="104" r="2.2"/><circle cx="820" cy="104" r="2.2"/><circle cx="484" cy="316" r="2.2"/><circle cx="820" cy="316" r="2.2"/></g>
    <text x="496" y="132" font-size="13.5" letter-spacing="2.8" fill="#c8ecd8">AZURE SERVICES · EXIT 2</text>
    <text x="496" y="186" font-size="46" font-weight="600" letter-spacing="-1" fill="#fff">Azure Functions</text>
    <text x="496" y="218" font-size="19" font-weight="400" fill="#e0f2e8">Node 22 · v4 programming model</text>
    <text x="496" y="246" font-size="17" font-weight="400" fill="#c8e6d5">HTTP triggers for the API</text>
    <text x="496" y="274" font-size="17" font-weight="400" fill="#c8e6d5">timer trigger keeps it warm</text>
    <text x="496" y="302" font-size="17" font-weight="400" fill="#c8e6d5">session token checked every call</text>
    <g clip-path="url(#cS2)"><g class="sheen" style="animation-delay:.9s"><rect x="340" y="60" width="150" height="300" fill="url(#sheenG)" transform="skewX(-22)"/></g></g>

    <g filter="url(#blur)"><rect x="850" y="86" width="372" height="252" rx="18" fill="#053324" opacity=".5"/></g>
    <rect x="850" y="86" width="372" height="252" rx="18" fill="url(#sign)" opacity=".98"/>
    <rect x="856" y="92" width="360" height="240" rx="14" fill="none" stroke="#eef6f1" stroke-width="2.4"/>
    <path d="M862 87 H1208" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
    <g fill="#c9d4cc"><circle cx="868" cy="104" r="2.2"/><circle cx="1204" cy="104" r="2.2"/><circle cx="868" cy="316" r="2.2"/><circle cx="1204" cy="316" r="2.2"/></g>
    <text x="880" y="132" font-size="13.5" letter-spacing="2.8" fill="#c8ecd8">AZURE SERVICES · EXIT 3</text>
    <text x="880" y="186" font-size="46" font-weight="600" letter-spacing="-1" fill="#fff">Cosmos DB</text>
    <text x="880" y="218" font-size="19" font-weight="400" fill="#e0f2e8">serverless · 3 containers</text>
    <text x="880" y="246" font-size="17" font-weight="400" fill="#c8e6d5">partition keys = access paths</text>
    <text x="880" y="274" font-size="17" font-weight="400" fill="#c8e6d5">unique key: one stamp each</text>
    <text x="880" y="302" font-size="17" font-weight="400" fill="#c8e6d5">ETag-guarded point awards</text>
    <g clip-path="url(#cS3)"><g class="sheen" style="animation-delay:1.8s"><rect x="710" y="60" width="150" height="300" fill="url(#sheenG)" transform="skewX(-22)"/></g></g>
    </g>
    </g>

    <path d="M560 418 H640 L1200 630 H0 Z" fill="url(#road)"/>
    <path d="M560 418 H640 L1200 630 H0 Z" fill="url(#sky)" opacity=".08"/>
    <path d="M560 418 L0 630 M640 418 L1200 630" stroke="#d9d4de" stroke-width="3" opacity=".35"/>
