    </g>

    <text x="120" y="32" font-size="12.5" letter-spacing="3.4" fill="#f0d9c8">A LOCAL GOVERNMENT FIELD REPORT</text>
    <text x="120" y="78" font-size="44" font-weight="600" letter-spacing="-1.2" fill="#fff">The road to a <tspan fill="#7ff0c0">conversation</tspan>.</text>
    <text x="1150" y="32" text-anchor="end" font-size="16" font-weight="400" fill="#e8d5c5">Eagle Ridge · Galena, Illinois</text>
