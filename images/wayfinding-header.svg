      <path class="head" pathLength="1200" style="animation-delay:-1.2s" d="M586 420 L360 630" stroke="#fff1bd" stroke-width="6"/>
      <path class="head" pathLength="1200" style="animation-delay:-2s" d="M588 420 L220 630" stroke="#fff1bd" stroke-width="5"/>
      <path class="head" pathLength="1200" style="animation-delay:-.6s" d="M592 420 L420 630" stroke="#fff1bd" stroke-width="5"/>
      <path class="tail" pathLength="1200" d="M610 420 L840 630" stroke="#ff6662" stroke-width="7"/>
      <path class="tail" pathLength="1200" style="animation-delay:-1.4s" d="M614 420 L1020 630" stroke="#ff6662" stroke-width="6"/>
      <path class="tail" pathLength="1200" style="animation-delay:-2.4s" d="M612 420 L900 630" stroke="#ff6662" stroke-width="5"/>
