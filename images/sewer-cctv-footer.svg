<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI Variable Display','Segoe UI',Inter,system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="68%" cy="32%" r="105%"><stop offset="0%" stop-color="#0b1f3a"/><stop offset="45%" stop-color="#06122a"/><stop offset="100%" stop-color="#02060d"/></radialGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#cfeeff"/><stop offset="55%" stop-color="#38b6ff"/><stop offset="100%" stop-color="#1f6fd1"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e9e0ff"/><stop offset="55%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c5cf0"/></linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38b6ff" stop-opacity="0"/><stop offset="85%" stop-color="#38b6ff" stop-opacity=".09"/><stop offset="100%" stop-color="#8fd6ff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="gLaser" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38b6ff" stop-opacity="0"/><stop offset="100%" stop-color="#8fd6ff" stop-opacity=".35"/></linearGradient>
    <radialGradient id="tube" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#01030a"/><stop offset="40%" stop-color="#041026"/><stop offset="100%" stop-color="#0d2a50"/></radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#04162c"/><stop offset="100%" stop-color="#0b3563"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0f2744" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowS" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="aB" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#38b6ff"/></marker>
    <marker id="aV" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#a78bfa"/></marker>
    <marker id="aR" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#ff5c7a"/></marker>
    <marker id="aD" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#4f7699"/></marker>
    <path id="ms" d="M0 0h11.4v11.4H0zm12.6 0H24v11.4H12.6zM0 12.6h11.4V24H0zm12.6 0H24V24H12.6z"/>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
    <pattern id="grip" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M7 1 L13 7 L7 13 L1 7 Z" fill="#0f2a4d" stroke="#1d4b7a" stroke-width=".8"/></pattern>
    <clipPath id="cov"><circle cx="170" cy="150" r="92"/></clipPath>
    <path id="rim" d="M-104 0 a104 104 0 1 1 208 0 a104 104 0 1 1 -208 0"/>
    <linearGradient id="glintG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#8fd6ff" stop-opacity=".22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code','Cascadia Mono',Consolas,'Courier New',monospace}
    .muted{fill:#8bb4d6}.dim{fill:#4f7699}
    .band{animation:band 7s linear infinite}
    @keyframes band{0%{transform:translateY(-160px)}100%{transform:translateY(320px)}}
    .corner{animation:corner 2.4s ease-in-out infinite}
    @keyframes corner{0%,100%{opacity:.35}50%{opacity:1}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:.12}}
    .spin{animation:spin 4s linear infinite;transform-origin:0 0}
    .spin2{animation:spin 2.4s linear infinite;transform-origin:0 0}
    .spinr{animation:spin 9s linear infinite reverse;transform-origin:0 0}
    .spinslow{animation:spin 60s linear infinite;transform-origin:0 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .under{stroke-dasharray:1;animation:under 12s linear infinite}
    @keyframes under{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}18%{stroke-dashoffset:0}94%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    .ping{animation:ping 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping{0%{transform:scale(.2);opacity:1}35%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
    .lock{animation:lock 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes lock{0%{transform:scale(1.9);opacity:0}9%{transform:scale(1);opacity:1}70%{transform:scale(1);opacity:1}88%,100%{transform:scale(1);opacity:.28}}
    .lbl{animation:lbl 4s linear infinite}
    @keyframes lbl{0%{opacity:.3}7%{opacity:1}70%{opacity:1}88%,100%{opacity:.3}}
    .spin40{animation:spin 40s linear infinite;transform-origin:0 0}
    .glint{animation:glint 5s ease-in-out infinite}
    @keyframes glint{0%{transform:translateX(-260px)}60%,100%{transform:translateX(260px)}}
    .sw{animation:sw 3.6s ease-in-out infinite;transform-origin:0 0}
    @keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
    .ring{animation:ring 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ring{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.25);opacity:0}}
    [class]{animation-fill-mode:both}
  </style>

  <g clip-path="url(#frame)" fill="#e6f4ff">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity=".5"/>
  <g class="band"><rect width="1200" height="160" fill="url(#gBand)"/><rect y="159" width="1200" height="1.5" fill="#8fd6ff" opacity=".35"/></g>

  <circle cx="170" cy="150" r="122" fill="#050f20" stroke="#0b2342" stroke-width="6"/>
  <circle cx="170" cy="150" r="118" fill="#0a1d38" stroke="#1d4b7a" stroke-width="2"/>
  <g transform="translate(170 150)"><g class="spin40">
    <text font-size="12" letter-spacing="2.2" font-weight="700" class="mono" fill="#cfeeff"><textPath href="#rim">AI PROPOSES · A PERSON DISPOSES · EVERY DECISION LEAVES A RECORD ·</textPath></text>
  </g></g>
  <circle cx="170" cy="150" r="93" fill="none" stroke="#38b6ff" stroke-width="1.6"/>
  <g clip-path="url(#cov)">
    <rect x="78" y="58" width="184" height="184" fill="#081a33"/>
    <rect x="78" y="58" width="184" height="184" fill="url(#grip)"/>
    <g class="glint"><rect x="110" y="50" width="120" height="200" fill="url(#glintG)" transform="rotate(20 170 150)"/></g>
  </g>
  <ellipse cx="104" cy="150" rx="8" ry="4" fill="#01040a"/><ellipse cx="236" cy="150" rx="8" ry="4" fill="#01040a"/>
  <circle class="ring" cx="170" cy="150" r="80" fill="none" stroke="#8fd6ff" stroke-width="1.6"/>
  <circle cx="170" cy="150" r="42" fill="#041229" stroke="#38b6ff" stroke-width="2"/>
  <text x="170" y="134" text-anchor="middle" font-size="7.5" letter-spacing="2" class="mono dim">PUBLIC WORKS</text>
  <text x="170" y="160" text-anchor="middle" font-size="26" font-weight="900" fill="url(#gBlue)">AI</text>
  <text x="170" y="176" text-anchor="middle" font-size="7.5" letter-spacing="2" class="mono dim">SEWER · 2026</text>

  <text x="340" y="84" font-size="32" font-weight="900">The model does the watching.</text>
  <text x="340" y="126" font-size="32" font-weight="900" fill="url(#gViolet)">The inspector does the judging.</text>
  <line x1="340" y1="160" x2="1160" y2="160" stroke="#1d4b7a" stroke-width="2"/>
  <circle cx="445" cy="160" r="3" fill="#38b6ff"/>
  <g transform="translate(445 160)"><g class="sw" style="animation-delay:-0.0s"><line x1="0" y1="0" x2="0" y2="20" stroke="#2f6aa6" stroke-width="1.4"/><rect x="-95" y="20" width="190" height="70" rx="8" fill="#0a1d38" stroke="#38b6ff" stroke-width="1.5"/><circle cy="32" r="5" fill="#030b18" stroke="#1d4b7a"/><text y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" class="mono" fill="#cfeeff">202 + LOCATION</text><text y="79" text-anchor="middle" font-size="10.5" class="muted">never block the caller</text></g></g>
  <circle cx="650" cy="160" r="3" fill="#38b6ff"/>
  <g transform="translate(650 160)"><g class="sw" style="animation-delay:-0.9s"><line x1="0" y1="0" x2="0" y2="20" stroke="#2f6aa6" stroke-width="1.4"/><rect x="-95" y="20" width="190" height="70" rx="8" fill="#0a1d38" stroke="#a78bfa" stroke-width="1.5"/><circle cy="32" r="5" fill="#030b18" stroke="#1d4b7a"/><text y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" class="mono" fill="#cfeeff">PT1H</text><text y="79" text-anchor="middle" font-size="10.5" class="muted">give the flow patience</text></g></g>
  <circle cx="855" cy="160" r="3" fill="#38b6ff"/>
  <g transform="translate(855 160)"><g class="sw" style="animation-delay:-1.8s"><line x1="0" y1="0" x2="0" y2="20" stroke="#2f6aa6" stroke-width="1.4"/><rect x="-95" y="20" width="190" height="70" rx="8" fill="#0a1d38" stroke="#38b6ff" stroke-width="1.5"/><circle cy="32" r="5" fill="#030b18" stroke="#1d4b7a"/><text y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" class="mono" fill="#cfeeff">KEYFRAME THUMBS</text><text y="79" text-anchor="middle" font-size="10.5" class="muted">evidence beside each finding</text></g></g>
  <circle cx="1060" cy="160" r="3" fill="#38b6ff"/>
  <g transform="translate(1060 160)"><g class="sw" style="animation-delay:-2.7s"><line x1="0" y1="0" x2="0" y2="20" stroke="#2f6aa6" stroke-width="1.4"/><rect x="-95" y="20" width="190" height="70" rx="8" fill="#0a1d38" stroke="#38b6ff" stroke-width="1.5"/><circle cy="32" r="5" fill="#030b18" stroke="#1d4b7a"/><text y="62" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" class="mono" fill="#cfeeff">MI + DELEGATION SAS</text><text y="79" text-anchor="middle" font-size="10.5" class="muted">no keys anywhere</text></g></g>
  <text x="340" y="282" font-size="13" class="dim">Azure AI Content Understanding · Azure Functions · Power Automate · Power Apps · SharePoint</text>

  <rect width="1200" height="300" fill="url(#scan)" opacity=".2"/>
  <g class="corner"><path d="M14 36 V14 H36 M1164 14 H1186 V36 M1186 264 V286 H1164 M36 286 H14 V264" fill="none" stroke="#38b6ff" stroke-width="2"/></g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#16324f" stroke-width="2"/>
</svg>
