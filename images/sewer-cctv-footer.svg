<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="'Segoe UI Variable Display','Segoe UI',Inter,system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="68%" cy="32%" r="105%"><stop offset="0%" stop-color="#0b1f3a"/><stop offset="45%" stop-color="#06122a"/><stop offset="100%" stop-color="#02060d"/></radialGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#cfeeff"/><stop offset="55%" stop-color="#38b6ff"/><stop offset="100%" stop-color="#1f6fd1"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e9e0ff"/><stop offset="55%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c5cf0"/></linearGradient>
    <linearGradient id="gBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38b6ff" stop-opacity="0"/><stop offset="85%" stop-color="#38b6ff" stop-opacity=".09"/><stop offset="100%" stop-color="#8fd6ff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="gLaser" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38b6ff" stop-opacity="0"/><stop offset="100%" stop-color="#8fd6ff" stop-opacity=".35"/></linearGradient>
    <radialGradient id="tube" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#01030a"/><stop offset="40%" stop-color="#041026"/><stop offset="100%" stop-color="#0d2a50"/></radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#04162c"/><stop offset="100%" stop-color="#0b3563"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0f2744" stroke-width="1"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowS" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="aB" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#38b6ff"/></marker>
    <marker id="aV" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#a78bfa"/></marker>
    <marker id="aR" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#ff5c7a"/></marker>
    <marker id="aD" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#4f7699"/></marker>
    <path id="ms" d="M0 0h11.4v11.4H0zm12.6 0H24v11.4H12.6zM0 12.6h11.4V24H0zm12.6 0H24V24H12.6z"/>
    <clipPath id="frame"><rect width="1200" height="280" rx="20"/></clipPath>
    <clipPath id="radar"><circle cx="1146" cy="140" r="38"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code','Cascadia Mono',Consolas,'Courier New',monospace}
    .muted{fill:#8bb4d6}.dim{fill:#4f7699}
    .band{animation:band 7s linear infinite}
    @keyframes band{0%{transform:translateY(-160px)}100%{transform:translateY(300px)}}
    .corner{animation:corner 2.4s ease-in-out infinite}
    @keyframes corner{0%,100%{opacity:.35}50%{opacity:1}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:.12}}
    .spin{animation:spin 4s linear infinite;transform-origin:0 0}
    .spin2{animation:spin 2.4s linear infinite;transform-origin:0 0}
    .spinr{animation:spin 9s linear infinite reverse;transform-origin:0 0}
    .spinslow{animation:spin 60s linear infinite;transform-origin:0 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .under{stroke-dasharray:1;animation:under 12s linear infinite}
    @keyframes under{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}18%{stroke-dashoffset:0}94%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    .ping{animation:ping 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping{0%{transform:scale(.2);opacity:1}35%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
    .lock{animation:lock 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes lock{0%{transform:scale(1.9);opacity:0}9%{transform:scale(1);opacity:1}70%{transform:scale(1);opacity:1}88%,100%{transform:scale(1);opacity:.28}}
    .lbl{animation:lbl 4s linear infinite}
    @keyframes lbl{0%{opacity:.3}7%{opacity:1}70%{opacity:1}88%,100%{opacity:.3}}
    .trace{stroke-dasharray:.12 .88;animation:trace 4s linear infinite}
    @keyframes trace{to{stroke-dashoffset:-1}}
    .row0{animation:row0 10s linear infinite}
    @keyframes row0{0.00%{opacity:0.35}4.00%{opacity:0.35}6.00%{opacity:1}92.00%{opacity:1}94.00%{opacity:0.35}100.00%{opacity:0.35}}
    .ck0{stroke-dasharray:20;animation:ck0 10s ease-out infinite}
    @keyframes ck0{0%,6%{stroke-dashoffset:20}9%{stroke-dashoffset:0}92%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:20}}
    .row1{animation:row1 10s linear infinite}
    @keyframes row1{0.00%{opacity:0.35}18.00%{opacity:0.35}20.00%{opacity:1}92.00%{opacity:1}94.00%{opacity:0.35}100.00%{opacity:0.35}}
    .ck1{stroke-dasharray:20;animation:ck1 10s ease-out infinite}
    @keyframes ck1{0%,20%{stroke-dashoffset:20}23%{stroke-dashoffset:0}92%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:20}}
    .row2{animation:row2 10s linear infinite}
    @keyframes row2{0.00%{opacity:0.35}32.00%{opacity:0.35}34.00%{opacity:1}92.00%{opacity:1}94.00%{opacity:0.35}100.00%{opacity:0.35}}
    .ck2{stroke-dasharray:20;animation:ck2 10s ease-out infinite}
    @keyframes ck2{0%,34%{stroke-dashoffset:20}37%{stroke-dashoffset:0}92%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:20}}
    .row3{animation:row3 10s linear infinite}
    @keyframes row3{0.00%{opacity:0.35}46.00%{opacity:0.35}48.00%{opacity:1}92.00%{opacity:1}94.00%{opacity:0.35}100.00%{opacity:0.35}}
    .ck3{stroke-dasharray:20;animation:ck3 10s ease-out infinite}
    @keyframes ck3{0%,48%{stroke-dashoffset:20}51%{stroke-dashoffset:0}92%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:20}}
    .yours{animation:yours 10s linear infinite}
    @keyframes yours{0.00%{opacity:0}62.00%{opacity:0}64.00%{opacity:1}94.00%{opacity:1}96.00%{opacity:0}100.00%{opacity:0}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
    .ping3{animation:ping3 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping3{0%{transform:scale(.3);opacity:1}35%{transform:scale(2.4);opacity:0}100%{opacity:0}}
    @keyframes fr{0%,100%{opacity:.3}14%{opacity:1}34%{opacity:.3}}
    .fr0{animation:fr 2.4s ease-in-out infinite;animation-delay:0.00s}
    .fr1{animation:fr 2.4s ease-in-out infinite;animation-delay:0.22s}
    .fr2{animation:fr 2.4s ease-in-out infinite;animation-delay:0.44s}
    .fr3{animation:fr 2.4s ease-in-out infinite;animation-delay:0.66s}
    .fr4{animation:fr 2.4s ease-in-out infinite;animation-delay:0.88s}
    [class]{animation-fill-mode:both}
  </style>

  <g clip-path="url(#frame)" fill="#e6f4ff">
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity=".5"/>
  <g class="band"><rect width="1200" height="160" fill="url(#gBand)"/><rect y="159" width="1200" height="1.5" fill="#8fd6ff" opacity=".35"/></g>

  <text x="80" y="90" font-size="34" font-weight="900">AI proposes. <tspan fill="url(#gViolet)">A person disposes.</tspan></text>
  <text x="80" y="122" font-size="17" class="muted">Every finding gets a disposition · every disposition leaves a record</text>
  <g transform="translate(80 150)">
    <rect width="540" height="50" rx="25" fill="#030a14" stroke="#16324f" stroke-width="1.5"/>
    <rect class="trace" width="540" height="50" rx="25" fill="none" stroke="url(#gBlue)" stroke-width="2.2" pathLength="1" stroke-linecap="round"/>
    <g transform="translate(30 25)"><circle r="13" fill="#020915" stroke="#38b6ff" stroke-width="1.6"/><g class="spin2"><path d="M0 0 L4.4 -12.2 A13 13 0 0 1 6.8 -11.1 Z" fill="#38b6ff" fill-opacity="0.028"/><path d="M0 0 L6.8 -11.1 A13 13 0 0 1 8.9 -9.5 Z" fill="#38b6ff" fill-opacity="0.053"/><path d="M0 0 L8.9 -9.5 A13 13 0 0 1 10.6 -7.5 Z" fill="#38b6ff" fill-opacity="0.095"/><path d="M0 0 L10.6 -7.5 A13 13 0 0 1 11.9 -5.1 Z" fill="#38b6ff" fill-opacity="0.153"/><path d="M0 0 L11.9 -5.1 A13 13 0 0 1 12.7 -2.6 Z" fill="#38b6ff" fill-opacity="0.228"/><path d="M0 0 L12.7 -2.6 A13 13 0 0 1 13 0 Z" fill="#38b6ff" fill-opacity="0.320"/><rect x="0" y="-1" width="13" height="2" fill="#8fd6ff" filter="url(#glowS)"/></g></g>
    <text x="58" y="32" font-size="17" class="mono" fill="#8fd6ff">scan → detect → verify → record</text>
  </g>
  <text x="80" y="244" font-size="13.5" class="dim">Content Understanding · Azure Functions · Power Automate · Power Apps · SharePoint</text>

  <g font-size="12.5" class="mono">
    <g class="row0"><rect x="700" y="30" width="390" height="34" rx="17" fill="#030a14" stroke="#16324f"/><text x="742" y="52" fill="#8bb4d6">202 + Location · never block the caller</text></g>
    <path class="ck0" d="M716 47 L722 53 L732 41" stroke="#8fd6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowS)"/>
    <g class="row1"><rect x="700" y="74" width="390" height="34" rx="17" fill="#030a14" stroke="#16324f"/><text x="742" y="96" fill="#8bb4d6">HTTP action timeout · PT1H</text></g>
    <path class="ck1" d="M716 91 L722 97 L732 85" stroke="#8fd6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowS)"/>
    <g class="row2"><rect x="700" y="118" width="390" height="34" rx="17" fill="#030a14" stroke="#16324f"/><text x="742" y="140" fill="#8bb4d6">keyframe thumbnail beside every finding</text></g>
    <path class="ck2" d="M716 135 L722 141 L732 129" stroke="#8fd6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowS)"/>
    <g class="row3"><rect x="700" y="162" width="390" height="34" rx="17" fill="#030a14" stroke="#16324f"/><text x="742" y="184" fill="#8bb4d6">DefaultAzureCredential + delegation SAS</text></g>
    <path class="ck3" d="M716 179 L722 185 L732 173" stroke="#8fd6ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowS)"/>
    <g class="yours"><g class="pulse"><rect x="700" y="210" width="390" height="38" rx="19" fill="url(#gViolet)" filter="url(#glowS)"/></g>
      <text x="895" y="234" text-anchor="middle" font-size="14.5" font-weight="800" fill="#150a33">your turn → find your unwatched footage</text></g>
  </g>

