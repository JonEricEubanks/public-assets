<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <clipPath id="round"><rect width="1100" height="210" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1100" height="210" fill="#ffffff"/>
    <!-- Header -->
    <rect width="1100" height="48" fill="#2f5496"/>
    <!-- Striped rows -->
    <rect y="48" width="1100" height="54" fill="#ffffff"/>
    <rect y="102" width="1100" height="60" fill="#f4f7fc"/>
    <rect y="162" width="1100" height="48" fill="#ffffff"/>
    <!-- Row borders -->
    <line x1="0" y1="102" x2="1100" y2="102" stroke="#e4e9f2"/>
    <line x1="0" y1="162" x2="1100" y2="162" stroke="#e4e9f2"/>
    <!-- Header text -->
    <g fill="#ffffff" font-size="15" font-weight="600" letter-spacing="0.5">
      <text x="20" y="31">Harness</text>
      <text x="200" y="31">Built for</text>
      <text x="580" y="31">Authoring model</text>
      <text x="850" y="31">Billing</text>
    </g>
    <!-- Body text -->
    <g font-size="14" fill="#1a1a1a">
      <text x="20" y="82" font-weight="700">Copilot Chat</text>
      <text x="200" y="82">Customizing the Microsoft 365 Copilot Chat experience</text>
      <text x="580" y="82">Same harness as M365 Copilot Chat</text>
      <text x="850" y="82">Existing rate card</text>

      <text x="20" y="138" font-weight="700">Standard</text>
      <text x="200" y="138">Scripted, predictable conversational agents</text>
      <text x="580" y="138">Topics, triggers, branching paths</text>
      <text x="850" y="130">Existing rate card; included for</text>
      <text x="850" y="146">licensed users in Teams and M365</text>

      <text x="20" y="190" font-weight="700">GitHub Copilot</text>
      <text x="200" y="190">Agentic, multi-step business processes</text>
      <text x="580" y="190">Natural-language instructions and skills</text>
      <text x="850" y="190">Copilot Credits, usage-based</text>
    </g>
  </g>
</svg>
