<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#073029"/>
      <stop offset="60%" stop-color="#041a17"/>
      <stop offset="100%" stop-color="#02100e"/>
    </radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/><stop offset="100%" stop-color="#ff7b1c"/>
    </linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="cres"><rect x="-26" y="-26" width="52" height="52" fill="#fff"/><circle cx="10" cy="-6" r="19" fill="#000"/></mask>
    <path id="gh" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    <path id="cp" d="M23.922 16.997C23.061 18.492 18.063 22.02 12 22.02 5.937 22.02.939 18.492.078 16.997A.641.641 0 0 1 0 16.741v-2.869a.883.883 0 0 1 .053-.22c.372-.935 1.347-2.292 2.605-2.656.167-.429.414-1.055.644-1.517a10.098 10.098 0 0 1-.052-1.086c0-1.331.282-2.499 1.132-3.368.397-.406.89-.717 1.474-.952C7.255 2.937 9.248 1.98 11.978 1.98c2.731 0 4.767.957 6.166 2.093.584.235 1.077.546 1.474.952.85.869 1.132 2.037 1.132 3.368 0 .368-.014.733-.052 1.086.23.462.477 1.088.644 1.517 1.258.364 2.233 1.721 2.605 2.656a.841.841 0 0 1 .053.22v2.869a.641.641 0 0 1-.078.256Zm-11.75-5.992h-.344a4.359 4.359 0 0 1-.355.508c-.77.947-1.918 1.492-3.508 1.492-1.725 0-2.989-.359-3.782-1.259a2.137 2.137 0 0 1-.085-.104L4 11.746v6.585c1.435.779 4.514 2.179 8 2.179 3.486 0 6.565-1.4 8-2.179v-6.585l-.098-.104s-.033.045-.085.104c-.793.9-2.057 1.259-3.782 1.259-1.59 0-2.738-.545-3.508-1.492a4.359 4.359 0 0 1-.355-.508Zm2.328 3.25c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm-5 0c.549 0 1 .451 1 1v2c0 .549-.451 1-1 1-.549 0-1-.451-1-1v-2c0-.549.451-1 1-1Zm3.313-6.185c.136 1.057.403 1.913.878 2.497.442.544 1.134.938 2.344.938 1.573 0 2.292-.337 2.657-.751.384-.435.558-1.15.558-2.361 0-1.14-.243-1.847-.705-2.319-.477-.488-1.319-.862-2.824-1.025-1.487-.161-2.192.138-2.533.529-.269.307-.437.808-.438 1.578v.021c0 .265.021.562.063.893Zm-1.626 0c.042-.331.063-.628.063-.894v-.02c-.001-.77-.169-1.271-.438-1.578-.341-.391-1.046-.69-2.533-.529-1.505.163-2.347.537-2.824 1.025-.462.472-.705 1.179-.705 2.319 0 1.211.175 1.926.558 2.361.365.414 1.084.751 2.657.751 1.21 0 1.902-.394 2.344-.938.475-.584.742-1.44.878-2.497Z"/>
    <clipPath id="frame"><rect width="1200" height="560" rx="20"/></clipPath>
  </defs>
  <style>
    text{fill:#e8fffa}
    .mono{font-family:'Cascadia Code',Consolas,monospace}
    .muted{fill:#7fbfb4}.dim{fill:#4f8f84}
    .tw1,.tw2,.tw3{animation-name:tw;animation-duration:3.4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .tw2{animation-delay:-1.2s}.tw3{animation-delay:-2.3s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}
    .shoot{animation-name:shoot;animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:linear}
    @keyframes shoot{0%,41%{opacity:0;transform:translate(0,0)}43.5%{opacity:1}48%{opacity:0;transform:translate(-210px,95px)}100%{opacity:0}}
    .rays{animation:spin 40s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sun{animation-name:sunPulse;animation-duration:4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    .cyc{animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:linear}
    .p0{animation-name:pulse0}.p25{animation-name:pulse25}.p50{animation-name:pulse50}.p75{animation-name:pulse75}
    @keyframes pulse0{0%{opacity:.9;transform:scale(1)}8%{opacity:0;transform:scale(1.9)}9%,94%{opacity:0;transform:scale(.8)}100%{opacity:.9;transform:scale(1)}}
    @keyframes pulse25{0%,22%{opacity:0;transform:scale(.8)}25%{opacity:.9;transform:scale(1)}33%{opacity:0;transform:scale(1.9)}34%,100%{opacity:0}}
    @keyframes pulse50{0%,47%{opacity:0;transform:scale(.8)}50%{opacity:.9;transform:scale(1)}58%{opacity:0;transform:scale(1.9)}59%,100%{opacity:0}}
    @keyframes pulse75{0%,72%{opacity:0;transform:scale(.8)}75%{opacity:.9;transform:scale(1)}83%{opacity:0;transform:scale(1.9)}84%,100%{opacity:0}}
    .h0{animation-name:hot0}.h25{animation-name:hot25}.h50{animation-name:hot50}.h75{animation-name:hot75}
    @keyframes hot0{0%{opacity:1}12%,92%{opacity:.45}100%{opacity:1}}
    @keyframes hot25{0%,16%{opacity:.45}25%{opacity:1}40%,100%{opacity:.45}}
    @keyframes hot50{0%,41%{opacity:.45}50%{opacity:1}65%,100%{opacity:.45}}
    @keyframes hot75{0%,66%{opacity:.45}75%{opacity:1}90%,100%{opacity:.45}}
    .l1{animation-name:log1}.l2{animation-name:log2}.l3{animation-name:log3}.l4{animation-name:log4}
    @keyframes log1{0%,3%{opacity:0}6%{opacity:1}97%{opacity:1}100%{opacity:0}}
    @keyframes log2{0%,27%{opacity:0}31%{opacity:1}97%{opacity:1}100%{opacity:0}}
    @keyframes log3{0%,52%{opacity:0}56%{opacity:1}97%{opacity:1}100%{opacity:0}}
    @keyframes log4{0%,77%{opacity:0}81%{opacity:1}97%{opacity:1}100%{opacity:0}}
    .cursor{animation-name:blink;animation-duration:1s;animation-iteration-count:infinite;animation-timing-function:steps(1)}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="560" fill="url(#bg)"/>

  <text x="60" y="52" font-size="15" letter-spacing="5" class="dim" font-weight="600">THE NIGHT SHIFT · EP 1 — THE DELEGATION ORBIT</text>
  <text x="60" y="76" font-size="13" class="muted">one lap ≈ 20 minutes · your hands-on time ≈ 10</text>

  <!-- night sky -->
  <g fill="#8ef0e0">
    <circle class="tw1" cx="150" cy="115" r="1.4"/><circle class="tw2" cx="300" cy="90" r="1.2"/>
    <circle class="tw3" cx="430" cy="105" r="1.3"/><circle class="tw1" cx="770" cy="95" r="1.5"/>
    <circle class="tw2" cx="990" cy="130" r="1.2"/><circle class="tw3" cx="1140" cy="150" r="1.3"/>
    <circle class="tw1" cx="80" cy="200" r="1.2"/><circle class="tw2" cx="1160" cy="320" r="1.2"/>
  </g>
  <g transform="translate(1080 80)">
    <circle r="32" fill="#ff7b1c" opacity=".08"/>
    <circle r="22" fill="url(#mango)" mask="url(#cres)" opacity=".92"/>
  </g>
  <g transform="translate(1120 60)">
    <g class="shoot">
      <line x1="0" y1="0" x2="30" y2="-14" stroke="#8ef0e0" stroke-width="2" stroke-linecap="round" opacity=".8"/>
      <circle r="2.2" fill="#e8fffa"/>
    </g>
  </g>

  <!-- orbit track -->
  <ellipse cx="600" cy="285" rx="310" ry="150" fill="none" stroke="#1d5b52" stroke-width="1.5" stroke-dasharray="3 7"/>

  <!-- YOU: the sun -->
  <g transform="translate(600 285)">
    <g class="rays"><circle r="60" fill="none" stroke="#ff7b1c" stroke-width="2" stroke-dasharray="2 11" opacity=".55"/></g>
    <g class="sun"><circle r="44" fill="url(#mango)" filter="url(#glow)"/></g>
    <text y="-2" text-anchor="middle" font-size="17" font-weight="800" fill="#3a1c00">YOU</text>
    <text y="16" text-anchor="middle" font-size="9.5" fill="#5c2d00" font-weight="700">specify · review</text>
  </g>

  <!-- stations -->
  <g transform="translate(600 135)">
    <g class="cyc p0"><circle r="34" fill="none" stroke="#8ef0e0" stroke-width="2.5"/></g>
    <g class="cyc h0">
      <circle r="25" fill="#07231f" stroke="#1d5b52" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" font-size="17">📋</text>
      <text y="-44" text-anchor="middle" font-size="14" font-weight="800" fill="#8ef0e0">1 · DELEGATE</text>
      <text y="-26" text-anchor="middle" font-size="12.5" class="muted">issue + acceptance criteria</text>
    </g>
  </g>
  <g transform="translate(910 285)">
    <g class="cyc p25"><circle r="34" fill="none" stroke="#8ef0e0" stroke-width="2.5"/></g>
    <g class="cyc h25">
      <circle r="25" fill="#07231f" stroke="#1d5b52" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" font-size="17">⚙️</text>
      <text x="44" y="-6" font-size="14" font-weight="800" fill="#8ef0e0">2 · WORK</text>
      <text x="44" y="12" font-size="12.5" class="muted">branch · code · run tests</text>
    </g>
  </g>
  <g transform="translate(600 435)">
    <g class="cyc p50"><circle r="34" fill="none" stroke="#8ef0e0" stroke-width="2.5"/></g>
    <g class="cyc h50">
      <circle r="25" fill="#07231f" stroke="#1d5b52" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" font-size="17">💬</text>
      <text y="52" text-anchor="middle" font-size="14" font-weight="800" fill="#8ef0e0">3 · REVIEW</text>
      <text y="70" text-anchor="middle" font-size="12.5" class="muted">you comment · it iterates</text>
    </g>
  </g>
  <g transform="translate(290 285)">
    <g class="cyc p75"><circle r="34" fill="none" stroke="#a371f7" stroke-width="2.5"/></g>
    <g class="cyc h75">
      <circle r="25" fill="#07231f" stroke="#1d5b52" stroke-width="1.5"/>
      <text y="6" text-anchor="middle" font-size="17">🎉</text>
      <text x="-44" y="-6" text-anchor="end" font-size="14" font-weight="800" fill="#a371f7">4 · MERGE</text>
      <text x="-44" y="12" text-anchor="end" font-size="12.5" class="muted">green checks → ship</text>
    </g>
  </g>

  <!-- the agent, orbiting -->
  <g>
    <animateMotion dur="16s" repeatCount="indefinite"
      path="M600,135 A310,150 0 0 1 600,435 A310,150 0 0 1 600,135"/>
    <g filter="url(#glow)">
      <rect x="-42" y="-17" width="84" height="34" rx="17" fill="#0f4a42" stroke="#55d8c7" stroke-width="2"/>
      <use href="#cp" transform="translate(-34 -10) scale(0.833)" fill="#8ef0e0"/>
      <text x="14" y="4.5" text-anchor="middle" font-size="12" fill="#8ef0e0" font-weight="700">agent</text>
    </g>
  </g>
  <!-- commit moons trailing the agent -->
  <g><animateMotion dur="16s" begin="-15.3s" repeatCount="indefinite" path="M600,135 A310,150 0 0 1 600,435 A310,150 0 0 1 600,135"/><circle r="6" fill="url(#mango)" opacity=".9"/></g>
  <g><animateMotion dur="16s" begin="-14.7s" repeatCount="indefinite" path="M600,135 A310,150 0 0 1 600,435 A310,150 0 0 1 600,135"/><circle r="4" fill="url(#mango)" opacity=".6"/></g>

  <!-- session log -->
  <g transform="translate(864 380)">
    <rect width="306" height="146" rx="10" fill="#02100e" stroke="#1d5b52" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="4" fill="#ff6b6b"/><circle cx="32" cy="17" r="4" fill="#ffd08a"/><circle cx="46" cy="17" r="4" fill="#57ab5a"/>
    <text x="62" y="21" font-size="11.5" class="dim mono">agent session log</text>
    <use href="#gh" transform="translate(274 9) scale(0.66)" fill="#4f8f84"/>
    <g class="mono" font-size="12">
      <text x="16" y="48" class="cyc l1" fill="#8ef0e0">▸ parsing issue #7 — 3 criteria found</text>
      <text x="16" y="72" class="cyc l2" fill="#e8fffa">▸ npm test → 12 passed ✓</text>
      <text x="16" y="96" class="cyc l3" fill="#ffd08a">▸ review: “rename fn” — pushed fix</text>
      <text x="16" y="120" class="cyc l4" fill="#a371f7">▸ merged · issue closed 🎉</text>
    </g>
    <rect class="cursor" x="16" y="128" width="7" height="10" fill="#8ef0e0"/>
  </g>

  <!-- takeaway -->
  <text x="60" y="524" font-size="14.5" class="muted">Every lap, you only touch <tspan fill="#8ef0e0" font-weight="700">12 o'clock</tspan> and <tspan fill="#8ef0e0" font-weight="700">6 o'clock</tspan> — the agent flies the rest of the orbit.</text>
  </g>
  <rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#1d5b52" stroke-width="2"/>
</svg>
