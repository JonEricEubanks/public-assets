<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="215" viewBox="0 0 1100 215" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <clipPath id="round"><rect width="1100" height="215" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1100" height="215" fill="#ffffff"/>
    <!-- Header -->
    <rect width="1100" height="48" fill="#2f5496"/>
    <!-- Striped rows -->
    <rect y="48" width="1100" height="56" fill="#ffffff"/>
    <rect y="104" width="1100" height="56" fill="#f4f7fc"/>
    <rect y="160" width="1100" height="55" fill="#ffffff"/>
    <!-- Row borders -->
    <line x1="0" y1="104" x2="1100" y2="104" stroke="#e4e9f2"/>
    <line x1="0" y1="160" x2="1100" y2="160" stroke="#e4e9f2"/>
    <!-- Header text -->
    <g fill="#ffffff" font-size="15" font-weight="600" letter-spacing="0.5">
      <text x="20" y="31">If a knowledgeable person would&#8230;</text>
      <text x="620" y="31">The hard part is&#8230;</text>
      <text x="800" y="31">Reach for&#8230;</text>
    </g>
    <!-- Body text -->
    <g font-size="14" fill="#1a1a1a">
      <text x="20" y="84">Find the right document and read the answer out of it</text>
      <text x="620" y="84">Retrieval</text>
      <text x="800" y="84">Standard harness, grounded well</text>

      <text x="20" y="132">Read several sources, apply a rule with exceptions,</text>
      <text x="20" y="148">produce a structured result</text>
      <text x="620" y="140">Reasoning</text>
      <text x="800" y="140">GitHub Copilot harness</text>

      <text x="20" y="194">Follow the same steps every time with no judgment involved</text>
      <text x="620" y="194">Neither</text>
      <text x="800" y="194">A workflow, or no model at all</text>
    </g>
  </g>
</svg>
