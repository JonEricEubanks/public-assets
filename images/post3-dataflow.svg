    <path id="react" d="M14.23 12.004a2.236 2.236 0 0 1-2.235 2.236 2.236 2.236 0 0 1-2.236-2.236 2.236 2.236 0 0 1 2.235-2.236 2.236 2.236 0 0 1 2.236 2.236zm2.648-10.69c-1.346 0-3.107.96-4.888 2.622-1.78-1.653-3.542-2.602-4.887-2.602-.41 0-.783.093-1.106.278-1.375.793-1.683 3.264-.973 6.365C1.98 8.917 0 10.42 0 12.004c0 1.59 1.99 3.097 5.043 4.03-.704 3.113-.39 5.588.988 6.38.32.187.69.275 1.102.275 1.345 0 3.107-.96 4.888-2.624 1.78 1.654 3.542 2.603 4.887 2.603.41 0 .783-.09 1.106-.275 1.374-.792 1.683-3.263.973-6.365C22.02 15.096 24 13.59 24 12.004c0-1.59-1.99-3.097-5.043-4.032.704-3.11.39-5.587-.988-6.38-.318-.184-.688-.277-1.092-.278zm-.005 1.09v.006c.225 0 .406.044.558.127.666.382.955 1.835.73 3.704-.054.46-.142.945-.25 1.44-.96-.236-2.006-.417-3.107-.534-.66-.905-1.345-1.727-2.035-2.447 1.592-1.48 3.087-2.292 4.105-2.295zm-9.77.02c1.012 0 2.514.808 4.11 2.28-.686.72-1.37 1.537-2.02 2.442-1.107.117-2.154.298-3.113.538-.112-.49-.195-.964-.254-1.42-.23-1.868.054-3.32.714-3.707.19-.09.4-.127.563-.132zm4.882 3.05c.455.468.91.992 1.36 1.564-.44-.02-.89-.034-1.345-.034-.46 0-.915.01-1.36.034.44-.572.895-1.096 1.345-1.565zM12 8.1c.74 0 1.477.034 2.202.093.406.582.802 1.203 1.183 1.86.372.64.71 1.29 1.018 1.946-.308.655-.646 1.31-1.013 1.95-.38.66-.773 1.288-1.18 1.87-.728.063-1.466.098-2.21.098-.74 0-1.477-.035-2.202-.093-.406-.582-.802-1.204-1.183-1.86-.372-.64-.71-1.29-1.018-1.946.303-.657.646-1.313 1.013-1.954.38-.66.773-1.286 1.18-1.868.728-.064 1.466-.098 2.21-.098zm-3.635.254c-.24.377-.48.763-.704 1.16-.225.39-.435.782-.635 1.174-.265-.656-.49-1.31-.676-1.947.64-.15 1.315-.283 2.015-.386zm7.26 0c.695.103 1.365.23 2.006.387-.18.632-.405 1.282-.66 1.933-.2-.39-.41-.783-.64-1.174-.225-.392-.465-.774-.705-1.146zm3.063.675c.484.15.944.317 1.375.498 1.732.74 2.852 1.708 2.852 2.476-.005.768-1.125 1.74-2.857 2.475-.42.18-.88.342-1.355.493-.28-.958-.646-1.956-1.1-2.98.45-1.017.81-2.01 1.085-2.964zm-13.395.004c.278.96.645 1.957 1.1 2.98-.45 1.017-.812 2.01-1.086 2.964-.484-.15-.944-.318-1.37-.5-1.732-.737-2.852-1.706-2.852-2.474 0-.768 1.12-1.742 2.852-2.476.42-.18.88-.342 1.356-.494zm11.678 4.28c.265.657.49 1.312.676 1.948-.64.157-1.316.29-2.016.39.24-.375.48-.762.705-1.158.225-.39.435-.788.636-1.18zm-9.945.02c.2.392.41.783.64 1.175.23.39.465.772.705 1.143-.695-.102-1.365-.23-2.006-.386.18-.63.406-1.282.66-1.933zM17.92 16.32c.112.493.2.968.254 1.423.23 1.868-.054 3.32-.714 3.708-.147.09-.338.128-.563.128-1.012 0-2.514-.807-4.11-2.28.686-.72 1.37-1.536 2.02-2.44 1.107-.118 2.154-.3 3.113-.54zm-11.83.01c.96.234 2.006.415 3.107.532.66.905 1.345 1.727 2.035 2.446-1.595 1.483-3.092 2.295-4.11 2.295-.22-.005-.406-.05-.553-.132-.666-.38-.955-1.834-.73-3.703.054-.46.142-.944.25-1.438zm4.56.64c.44.02.89.034 1.345.034.46 0 .915-.01 1.36-.034-.44.572-.895 1.095-1.345 1.565-.455-.47-.91-.993-1.36-1.565z"/>
    <clipPath id="frame"><rect width="1200" height="560" rx="20"/></clipPath>
  </defs>
  <style>
    text{fill:#e8fffa}
    .mono{font-family:'Cascadia Code',Consolas,monospace}
    .muted{fill:#7fbfb4}.dim{fill:#4f8f84}
    .cyc{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:linear}
    .march{stroke-dasharray:13 11;animation-name:march;animation-duration:1.1s;animation-iteration-count:infinite;animation-timing-function:linear}
    @keyframes march{to{stroke-dashoffset:-48}}
    .redOut{animation-name:redOut}
    @keyframes redOut{0%{opacity:1}55%{opacity:1}60%,100%{opacity:0}}
    .greenIn{animation-name:greenIn}
    @keyframes greenIn{0%,56%{opacity:0}62%{opacity:1}100%{opacity:1}}
    .needle{animation-name:needle;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    @keyframes needle{0%,18%{transform:rotate(-62deg)}26%{transform:rotate(52deg)}62%{transform:rotate(52deg)}70%,100%{transform:rotate(-48deg)}}
    .alert{animation-name:alertIn}
    @keyframes alertIn{0%,27%{opacity:0;transform:scale(.5)}31%{opacity:1;transform:scale(1.1)}33%{transform:scale(1)}100%{opacity:1;transform:scale(1)}}
    .toastBad{animation-name:toastBad}
    @keyframes toastBad{0%,22%{opacity:0}26%{opacity:1}55%{opacity:1}59%,100%{opacity:0}}
    .toastGood{animation-name:toastGood}
    @keyframes toastGood{0%,62%{opacity:0}67%{opacity:1}100%{opacity:1}}
    .fillBad{animation-name:fillBad}
    @keyframes fillBad{0%,20%{opacity:0}28%{opacity:.45}55%{opacity:.45}60%,100%{opacity:0}}
    .fillGood{animation-name:fillGood}
    @keyframes fillGood{0%,62%{opacity:0}70%{opacity:.35}100%{opacity:.35}}
    .drop1,.drop2{animation-duration:1.3s;animation-iteration-count:infinite;animation-timing-function:ease-in;animation-name:drop}
    .drop2{animation-delay:-.65s}
    @keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(52px);opacity:0}}
    .wrench{animation-name:wrenchIn}
    @keyframes wrenchIn{0%,52%{opacity:0;transform:rotate(-40deg) scale(.4)}57%{opacity:1;transform:rotate(8deg) scale(1.05)}59%{transform:rotate(0deg) scale(1)}100%{opacity:1;transform:rotate(0deg) scale(1)}}
    .glug{animation-name:glug;animation-duration:3s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    @keyframes glug{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .tw1,.tw2,.tw3{animation-name:tw;animation-duration:3.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .tw2{animation-delay:-1.1s}.tw3{animation-delay:-2.2s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.7}}
    .shoot{animation-name:shoot;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:linear}
    @keyframes shoot{0%,41%{opacity:0;transform:translate(0,0)}43.5%{opacity:1}48%{opacity:0;transform:translate(-160px,72px)}100%{opacity:0}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="560" fill="url(#bg)"/>

  <text x="60" y="50" font-size="15" letter-spacing="5" class="dim" font-weight="600">THE NIGHT SHIFT · EP 3</text>
  <text x="60" y="74" font-size="13" class="muted">poison in the pipes — the exact path the CodeQL alert walked</text>

  <!-- night sky -->
  <g fill="#8ef0e0">
    <circle class="tw1" cx="300" cy="120" r="1.4"/><circle class="tw2" cx="470" cy="100" r="1.2"/>
    <circle class="tw3" cx="520" cy="42" r="1.3"/><circle class="tw1" cx="940" cy="50" r="1.5"/>
    <circle class="tw2" cx="1160" cy="120" r="1.2"/>
  </g>
  <g transform="translate(1100 66)">
    <circle r="32" fill="#ff7b1c" opacity=".08"/>
    <circle r="22" fill="url(#mango)" mask="url(#cres)" opacity=".92"/>
  </g>
  <g transform="translate(620 40)">
    <g class="shoot">
      <line x1="0" y1="0" x2="30" y2="-14" stroke="#8ef0e0" stroke-width="2" stroke-linecap="round" opacity=".8"/>
      <circle r="2.2" fill="#e8fffa"/>
    </g>
  </g>

  <!-- TANK -->
  <g>
    <rect x="70" y="150" width="150" height="170" rx="14" fill="#07231f" stroke="#1d5b52" stroke-width="2"/>
    <g class="glug"><rect x="78" y="208" width="134" height="104" rx="8" fill="url(#poison)" opacity=".75"/></g>
    <text x="145" y="268" text-anchor="middle" font-size="26" opacity=".8">☠</text>
    <text x="145" y="138" text-anchor="middle" font-size="14.5" class="mono" font-weight="700" fill="#ff9c9c">localStorage</text>
    <text x="145" y="345" text-anchor="middle" font-size="12.5" fill="#ff9c9c" font-weight="700">SOURCE</text>
    <text x="145" y="362" text-anchor="middle" font-size="11.5" class="dim">user-controlled JSON</text>
  </g>

  <!-- MAIN PIPE (outer casing) -->
  <path d="M220,235 H840 V318" fill="none" stroke="#0b332d" stroke-width="18" stroke-linejoin="round"/>
  <path d="M220,235 H840 V318" fill="none" stroke="#1d5b52" stroke-width="18" stroke-linejoin="round" stroke-opacity=".35"/>
  <!-- poisoned flow: source → junction (always red) -->
  <path class="march" d="M220,235 H600" fill="none" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round"/>
  <!-- poisoned flow: junction → sink (dies after fix) -->
  <g class="cyc redOut">
    <path class="march" d="M600,235 H840 V318" fill="none" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- BYPASS PIPE (autofix) -->
  <g class="cyc greenIn">
    <path d="M600,226 V74 H840 V226" fill="none" stroke="#0b332d" stroke-width="14" stroke-linejoin="round"/>
    <path class="march" d="M600,226 V74 H840 V226" fill="none" stroke="#57ab5a" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(720 74)">
      <rect x="-155" y="-22" width="310" height="44" rx="10" fill="#123b1e" stroke="#57ab5a" stroke-width="2"/>
      <text y="-2" text-anchor="middle" font-size="13.5" class="mono" fill="#7ee2a8">&lt;span&gt;{task.title}&lt;/span&gt;</text>
      <text y="15" text-anchor="middle" font-size="11.5" fill="#7fbfb4">Copilot Autofix — React escapes by default</text>
      <use href="#react" transform="translate(124 -10) scale(0.83)" fill="#61dafb"/>
    </g>
  </g>
  <g transform="translate(556 170)">
    <g class="cyc wrench">
      <circle r="16" fill="#123b1e" stroke="#57ab5a" stroke-width="2"/>
      <use href="#cp" transform="translate(-10 -10) scale(0.833)" fill="#7ee2a8"/>
    </g>
  </g>

  <!-- VALVE: JSON.parse -->
  <g transform="translate(400 235)">
    <circle r="20" fill="#07231f" stroke="#7fbfb4" stroke-width="2.5"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#7fbfb4" stroke-width="2.5"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#7fbfb4" stroke-width="2.5"/>
    <text y="-38" text-anchor="middle" font-size="13.5" class="mono" font-weight="700">JSON.parse()</text>
    <text y="42" text-anchor="middle" font-size="11.5" class="dim">parses · doesn't sanitize</text>
  </g>

  <!-- JUNCTION: task.title -->
  <g transform="translate(600 235)">
    <circle r="20" fill="#07231f" stroke="#ffd08a" stroke-width="2.5"/>
    <circle r="7" fill="#ffd08a" opacity=".85"/>
    <text y="-38" text-anchor="middle" font-size="13.5" class="mono" font-weight="700" fill="#ffd08a">task.title</text>
    <text y="42" text-anchor="middle" font-size="11.5" class="dim">assigned · never escaped</text>
  </g>

  <!-- GAUGE -->
  <g transform="translate(730 168)">
    <line x1="0" y1="30" x2="0" y2="52" stroke="#1d5b52" stroke-width="4"/>
    <path d="M-36 26 A36 36 0 1 1 36 26" fill="#07231f" stroke="#1d5b52" stroke-width="2"/>
    <path d="M-33 20 A36 36 0 0 1 -6 -33" fill="none" stroke="#57ab5a" stroke-width="5"/>
    <path d="M6 -33 A36 36 0 0 1 33 20" fill="none" stroke="#ff6b6b" stroke-width="5"/>
    <g class="needle"><line x1="0" y1="4" x2="0" y2="-27" stroke="#e8fffa" stroke-width="3" stroke-linecap="round"/></g>
    <circle r="4.5" fill="#e8fffa"/>
    <use href="#gh" transform="translate(-72 -58) scale(0.58)" fill="#7fbfb4"/>
    <text x="8" y="-48" text-anchor="middle" font-size="12.5" class="muted" font-weight="700">CodeQL poison meter</text>
    <g transform="translate(230 -20)"><g class="cyc alert">
      <rect x="-92" y="-15" width="184" height="30" rx="15" fill="#3b1210" stroke="#ff6b6b" stroke-width="2"/>
      <text y="4.5" text-anchor="middle" font-size="12" class="mono" fill="#ff9c9c" font-weight="700">⚠ CWE-79 · High · XSS</text>
    </g></g>
  </g>

  <!-- FAUCET + drops -->
  <g transform="translate(840 318)">
    <polygon points="-14,0 14,0 9,20 -9,20" fill="#0b332d" stroke="#1d5b52" stroke-width="1.5"/>
    <g class="cyc redOut">
      <circle class="drop1" cx="0" cy="28" r="4.5" fill="#ff6b6b"/>
      <circle class="drop2" cx="0" cy="28" r="4.5" fill="#ff6b6b"/>
    </g>
    <g class="cyc greenIn">
      <circle class="drop1" cx="0" cy="28" r="4.5" fill="#57ab5a"/>
      <circle class="drop2" cx="0" cy="28" r="4.5" fill="#57ab5a"/>
    </g>
  </g>
  <text x="880" y="330" font-size="13.5" class="mono" font-weight="700" fill="#ff9c9c">dangerouslySetInnerHTML</text>
  <text x="880" y="348" font-size="11.5" fill="#ff9c9c">SINK — renders raw HTML</text>

  <!-- BROWSER GLASS -->
  <g transform="translate(740 400)">
    <rect width="200" height="115" rx="12" fill="#07231f" stroke="#1d5b52" stroke-width="2"/>
    <circle cx="16" cy="15" r="3.5" fill="#ff6b6b"/><circle cx="28" cy="15" r="3.5" fill="#ffd08a"/><circle cx="40" cy="15" r="3.5" fill="#57ab5a"/>
    <line x1="0" y1="28" x2="200" y2="28" stroke="#1d5b52"/>
    <rect class="cyc fillBad" x="3" y="60" width="194" height="52" rx="8" fill="url(#poison)"/>
    <rect class="cyc fillGood" x="3" y="60" width="194" height="52" rx="8" fill="#2bb3a0"/>
    <g class="cyc toastBad">
      <text x="100" y="52" text-anchor="middle" font-size="12" class="mono" fill="#ff9c9c">&lt;img onerror=alert(1)&gt;</text>
      <text x="100" y="90" text-anchor="middle" font-size="12" font-weight="800" fill="#ffd7d7">script EXECUTED 💥</text>
    </g>
    <g class="cyc toastGood">
      <text x="100" y="52" text-anchor="middle" font-size="12" class="mono" fill="#7ee2a8">task.title → plain text</text>
      <text x="100" y="90" text-anchor="middle" font-size="12" font-weight="800" fill="#7ee2a8">rendered inert ✓</text>
    </g>
    <text x="100" y="132" text-anchor="middle" font-size="11.5" class="dim">the user's browser</text>
  </g>

  <!-- step numbers along path -->
  <g font-size="12" class="mono" fill="#4f8f84" text-anchor="middle">
    <text x="300" y="222">step 1</text>
    <text x="500" y="222">step 2</text>
    <text x="672" y="260">step 3</text>
    <text x="818" y="282">step 4</text>
  </g>

  <!-- legend -->
  <g transform="translate(470 448)" font-size="12">
    <rect x="-18" y="-20" width="268" height="66" rx="10" fill="#02100e" stroke="#1d5b52"/>
    <line x1="0" y1="0" x2="34" y2="0" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
    <text x="46" y="4" class="muted">poisoned flow · unescaped input</text>
    <line x1="0" y1="26" x2="34" y2="26" stroke="#57ab5a" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
    <text x="46" y="30" class="muted">patched flow · React-escaped bypass</text>
  </g>

  <!-- footer -->
  <text x="60" y="440" font-size="14.5" class="muted">The alert didn't say <tspan fill="#ff9c9c" class="mono">“XSS somewhere.”</tspan></text>
  <text x="60" y="464" font-size="14.5" class="muted">It walked the pipe: <tspan fill="#8ef0e0" font-weight="700">four steps, zero guesswork.</tspan></text>
  <text x="60" y="510" font-size="14.5" fill="#7ee2a8" font-weight="700">alert opened → fix merged: under 10 minutes.</text>
  <text x="60" y="532" font-size="12.5" class="dim">the path had four steps — the fix was one line</text>
  </g>
  <rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#1d5b52" stroke-width="2"/>
</svg>
