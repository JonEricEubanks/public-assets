<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041a17"/><stop offset="100%" stop-color="#02100e"/>
    </linearGradient>
    <linearGradient id="poison" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#8b1d4f"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/><stop offset="100%" stop-color="#ff7b1c"/>
    </linearGradient>
    <mask id="cres"><rect x="-26" y="-26" width="52" height="52" fill="#fff"/><circle cx="10" cy="-6" r="19" fill="#000"/></mask>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
