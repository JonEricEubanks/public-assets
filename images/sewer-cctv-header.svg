<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="78%" cy="50%" r="95%">
      <stop offset="0%" stop-color="#1a2f48"/><stop offset="50%" stop-color="#0b1726"/><stop offset="100%" stop-color="#050b13"/>
    </radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b8d8f5"/><stop offset="100%" stop-color="#3f7fcf"/></linearGradient>
    <radialGradient id="tube" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#01040a"/><stop offset="30%" stop-color="#07121f"/><stop offset="100%" stop-color="#1f3e63"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#b8d8f5" stop-opacity="0"/><stop offset="100%" stop-color="#b8d8f5" stop-opacity=".14"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1a2c"/><stop offset="100%" stop-color="#1a3f66"/></linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tubeClip"><circle cx="960" cy="150" r="128"/></clipPath>
    <path id="ms" d="M0 0h11.4v11.4H0zm12.6 0H24v11.4H12.6zM0 12.6h11.4V24H0zm12.6 0H24V24H12.6z"/>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
    .muted{fill:#93a9c2}.dim{fill:#5b7390}
    .under{stroke-dasharray:1;animation:under 12s linear infinite}
    @keyframes under{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}18%{stroke-dashoffset:0}96%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
    .c1{animation:chip 12s linear infinite}
    .c2{animation:chip 12s linear infinite;animation-delay:1.1s}
    .c3{animation:chip 12s linear infinite;animation-delay:2.2s}
    @keyframes chip{0%,18%{opacity:0;transform:translateY(8px)}23%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
    .b1{animation:box 8s linear infinite}
    .b2{animation:box 8s linear infinite;animation-delay:1.6s}
    @keyframes box{0%,14%{opacity:0}18%{opacity:1}84%{opacity:1}90%,100%{opacity:0}}
    .rec{animation:rec 1.4s steps(1) infinite}
    @keyframes rec{0%{opacity:1}50%{opacity:.2}}
    .shimmer{stroke-dasharray:14 60;animation:shimmer 3s linear infinite}
    @keyframes shimmer{to{stroke-dashoffset:-74}}
    [class]{animation-fill-mode:both}
  </style>

  <g clip-path="url(#frame)" fill="#eaf1f8">
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- marks + eyebrow -->
  <use href="#ms" transform="translate(80 52) scale(.8)" fill="#5b7390"/>
  <text x="112" y="68" font-size="13" letter-spacing="4" class="dim mono">AN AZURE AI FIELD REPORT · PUBLIC WORKS</text>

  <!-- title -->
  <text x="78" y="150" font-size="60" font-weight="900" letter-spacing="1">THE <tspan fill="url(#mango)">SECOND LOOK</tspan></text>
  <line class="under" x1="80" y1="170" x2="640" y2="170" stroke="#6aa9ec" stroke-width="3" pathLength="1" stroke-linecap="round"/>
  <text x="80" y="204" font-size="18" class="muted">AI watches the sewer footage first. An inspector makes the call.</text>

  <!-- series chips -->
  <g font-size="13" class="mono">
    <g class="c1">
      <rect x="80" y="228" width="118" height="30" rx="15" fill="#0c1a2b" stroke="#22384f"/>
      <text x="139" y="247" text-anchor="middle" fill="#8cbcea">01 · watch</text>
    </g>
    <g class="c2">
      <rect x="210" y="228" width="134" height="30" rx="15" fill="#0c1a2b" stroke="#22384f"/>
      <text x="277" y="247" text-anchor="middle" fill="#9dbbe8">02 · propose</text>
    </g>
    <g class="c3">
      <rect x="356" y="228" width="132" height="30" rx="15" fill="#0c1a2b" stroke="#22384f"/>
      <text x="422" y="247" text-anchor="middle" fill="#b8d8f5">03 · confirm</text>
    </g>
  </g>

  <!-- ===== TUNNEL · center (960,150) ===== -->
  <circle cx="960" cy="150" r="136" fill="none" stroke="#0e2135" stroke-width="10"/>
  <g clip-path="url(#tubeClip)">
    <circle cx="960" cy="150" r="128" fill="url(#tube)"/>
    <circle cx="960" cy="150" r="128" fill="url(#lamp)"/>
    <!-- wall seams converging to the vanishing point -->
    <g stroke="#2a4a70" stroke-width="1" opacity=".4">
      <path d="M960 22 L960 132 M1088 150 L978 150 M832 150 L942 150 M869.5 59.5 L947.3 137.3 M1050.5 59.5 L972.7 137.3"/>
    </g>
    <!-- joint rings receding -->
    <g fill="none" stroke="#3a5f8a">
      <circle cx="960" cy="150" r="94" stroke-width="2.4" opacity=".7"/>
      <circle cx="960" cy="150" r="68" stroke-width="2" opacity=".55"/>
      <circle cx="960" cy="150" r="49" stroke-width="1.6" opacity=".42"/>
      <circle cx="960" cy="150" r="35" stroke-width="1.3" opacity=".32"/>
      <circle cx="960" cy="150" r="25" stroke-width="1.1" opacity=".24"/>
      <circle cx="960" cy="150" r="18" stroke-width="1" opacity=".18"/>
    </g>
    <!-- flow line / water -->
    <path d="M867 238 L942.6 166.5 L977.4 166.5 L1053 238 L1053 290 L867 290 Z" fill="url(#water)"/>
    <path d="M867 238 L942.6 166.5 L977.4 166.5 L1053 238" fill="none" stroke="#4a86c5" stroke-width="1.4" opacity=".55"/>
    <path class="shimmer" d="M880 250 L946 172 M1040 250 L974 172" stroke="#8cbcea" stroke-width="1.4" fill="none" opacity=".45"/>

    <!-- defect: fracture, upper-left wall -->
    <path d="M876 58 L886 70 L880 80 L894 92 L889 104" stroke="#ef8a7a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- defect: roots at a joint, upper-right -->
    <g stroke="#6aa9ec" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M1000 72 C998 84 1004 90 1000 102"/><path d="M1008 69 C1006 82 1013 92 1009 106"/><path d="M1016 72 C1019 84 1013 92 1018 100"/>
    </g>

    <!-- AI scan ring -->
    <circle cx="960" cy="150" r="18" fill="none" stroke="#5b9bd5" stroke-width="2">
      <animate attributeName="r" values="18;128" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- CCTV overlay -->
    <rect x="893" y="243" width="134" height="20" rx="4" fill="#03070d" opacity=".82"/>
    <text x="960" y="257" text-anchor="middle" font-size="11" class="mono" fill="#d3e2f2">0127.5 FT · 00:04:12</text>
  </g>

  <!-- detection boxes + labels (outside the clip so labels can sit beside the pipe) -->
  <g class="b1">
    <rect x="866" y="50" width="40" height="62" rx="3" fill="none" stroke="#ef8a7a" stroke-width="1.6" stroke-dasharray="5 3"/>
    <line x1="866" y1="60" x2="834" y2="52" stroke="#ef8a7a" stroke-width="1.2"/>
    <rect x="690" y="38" width="142" height="26" rx="13" fill="#0c1a2b" stroke="#ef8a7a"/>
    <text x="761" y="55" text-anchor="middle" font-size="11" class="mono" fill="#ef8a7a">FRACTURE · 91%</text>
  </g>
  <g class="b2">
    <rect x="992" y="62" width="34" height="48" rx="3" fill="none" stroke="#6aa9ec" stroke-width="1.6" stroke-dasharray="5 3"/>
    <line x1="1026" y1="68" x2="1094" y2="58" stroke="#6aa9ec" stroke-width="1.2"/>
    <rect x="1094" y="44" width="96" height="26" rx="13" fill="#0c1a2b" stroke="#6aa9ec"/>
    <text x="1142" y="61" text-anchor="middle" font-size="11" class="mono" fill="#6aa9ec">ROOTS · 87%</text>
  </g>

  <!-- REC indicator -->
  <g class="rec"><circle cx="1122" cy="266" r="4.5" fill="#ec6a5e" filter="url(#glow)"/></g>
  <text x="1132" y="270" font-size="11" letter-spacing="2" class="mono dim">REC</text>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#22384f" stroke-width="2"/>
</svg>
