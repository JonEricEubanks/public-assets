      <text x="434" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5A1E">Fracture · 12 o'clock · 91%</text>
    </g>
  </g>
  <g>
    <path d="M 620 96 C 618 116 626 124 622 140 M 632 96 C 630 112 638 122 634 144 M 644 96 C 646 114 640 126 646 138" stroke="#6BA87A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="634" y1="150" x2="634" y2="196" stroke="#6BA87A" stroke-width="1.5" marker-end="url(#harr)"/>
