      <rect x="548" y="202" width="176" height="36" rx="18" fill="#FFFFFF" stroke="#6BA87A" stroke-width="1.5"/>
      <text x="636" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#2F5C3B">Roots · joint · 87%</text>
