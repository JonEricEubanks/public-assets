    <marker id="harr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#EEF2F5"/>
    </marker>
    <style>
      .scan { animation: scanmove 6s ease-in-out infinite; }
      @keyframes scanmove {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(640px); }
      }
      .blip { animation: blipfade 2.4s ease-in-out infinite; }
      @keyframes blipfade {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  <rect width="960" height="420" fill="#EEF2F5" rx="16"/>
