    <text x="99" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#EEF2F5" font-family="'Consolas','Courier New',monospace">0127.5 ft</text>
  </g>
  <g>
    <rect x="786" y="112" width="150" height="30" rx="6" fill="#0F172A" opacity="0.75"/>
    <text x="861" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#5E9E96" font-family="'Consolas','Courier New',monospace">00:04:12</text>
