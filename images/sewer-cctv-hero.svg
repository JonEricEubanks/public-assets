<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4F63"/>
      <stop offset="45%" stop-color="#293B4A"/>
      <stop offset="100%" stop-color="#1C2933"/>
    </linearGradient>
    <radialGradient id="crownLight" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#5E9E96" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5E9E96" stop-opacity="0"/>
