<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#f2fbf8"/><stop offset="100%" stop-color="#dcf1eb"/>
    </radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffc466"/><stop offset="100%" stop-color="#ff7b1c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eefaf6"/><stop offset="100%" stop-color="#e2f4ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b2a25" flood-opacity=".10"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrT" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#0e8f7e"/></marker>
    <marker id="arrA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="10" refY="6" orient="auto"><path d="M0 1 L10 6 L0 11z" fill="#e8730f"/></marker>
    <g id="agent">
      <circle r="28" fill="#ffffff" stroke="#0e8f7e" stroke-width="2"/>
      <rect x="-12" y="-8" width="24" height="17" rx="5" fill="none" stroke="#0e8f7e" stroke-width="2"/>
      <circle cx="-5" cy="0.5" r="2.2" fill="#0e8f7e"/><circle cx="5" cy="0.5" r="2.2" fill="#0e8f7e"/>
      <line x1="0" y1="-8" x2="0" y2="-14" stroke="#0e8f7e" stroke-width="2"/><circle cy="-16" r="2.4" fill="#ff7b1c"/>
    </g>
    <clipPath id="frame"><rect width="1200" height="630" rx="22"/></clipPath>
  </defs>
  <style>
    text{fill:#0b2a25}
    .mono{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
    .muted{fill:#3f7d73}.dim{fill:#6fa79c}
    .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .under{stroke-dasharray:1;animation:under 10s linear infinite}
    @keyframes under{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}22%{stroke-dashoffset:0}96%{opacity:1;stroke-dashoffset:0}100%{opacity:0}}
    .breath{animation:breath 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .ring{animation:ring 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
    .a1,.a2,.a3,.a4{animation:focus 8s ease-in-out infinite}
    .a2{animation-delay:-2s}.a3{animation-delay:-4s}.a4{animation-delay:-6s}
    @keyframes focus{0%,100%{opacity:.55}12%,28%{opacity:1}40%{opacity:.55}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#0e8f7e" stroke-width="1" opacity=".05"><path d="M0 210 H1200 M0 385 H1200 M0 560 H1200 M300 0 V630 M600 0 V630 M900 0 V630"/></g>

  <!-- sun -->
  <g transform="translate(1118 66)">
    <g class="spin"><circle r="34" fill="none" stroke="#ff9a3d" stroke-width="2" stroke-dasharray="2 10" opacity=".7"/></g>
    <circle r="21" fill="url(#mango)" filter="url(#glow)"/>
  </g>

  <!-- header -->
  <text x="64" y="64" font-size="13" letter-spacing="4" class="dim mono">A MICROSOFT FOUNDRY ARCHITECTURE NOTE</text>
  <text x="62" y="128" font-size="44" font-weight="900" letter-spacing="1">FEWER AGENTS. <tspan fill="url(#mango)">CLEARER AUTHORITY.</tspan></text>
  <line class="under" x1="64" y1="146" x2="640" y2="146" stroke="#ff9a3d" stroke-width="3" pathLength="1" stroke-linecap="round"/>
  <text x="64" y="178" font-size="18" class="muted">Multi-agent orchestration on Microsoft Foundry — and where the human stays in charge</text>

  <!-- specialist panel -->
  <g transform="translate(64 214)">
    <rect width="576" height="326" rx="20" fill="url(#panel)" stroke="#b8e3da" stroke-width="1.5"/>
    <text x="24" y="30" font-size="11" letter-spacing="3" font-weight="800" fill="#0e6f62">SPECIALIZED AGENTS · REASON &amp; RECOMMEND</text>

    <!-- spokes -->
    <g stroke="#0e8f7e" stroke-width="1.5" opacity=".45">
      <line x1="168" y1="112" x2="240" y2="160"/>
      <line x1="408" y1="112" x2="336" y2="160"/>
      <line x1="168" y1="262" x2="240" y2="200"/>
      <line x1="408" y1="262" x2="336" y2="200"/>
    </g>

    <!-- hub -->
    <rect x="178" y="152" width="220" height="56" rx="28" fill="#ffffff" stroke="#0e8f7e" stroke-width="2" filter="url(#shadow)"/>
    <text x="288" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0e6f62">AGENT FRAMEWORK</text>
    <text x="288" y="193" text-anchor="middle" font-size="10.5" class="dim mono">orchestration workflow</text>

    <!-- agents -->
    <g class="a1" transform="translate(150 96)"><use href="#agent"/><text y="50" text-anchor="middle" font-size="13" font-weight="700">Classify</text></g>
    <g class="a2" transform="translate(426 96)"><use href="#agent"/><text y="50" text-anchor="middle" font-size="13" font-weight="700">Extract</text></g>
    <g class="a3" transform="translate(150 246)"><use href="#agent"/><text y="50" text-anchor="middle" font-size="13" font-weight="700">Research policy</text></g>
    <g class="a4" transform="translate(426 246)"><use href="#agent"/><text y="50" text-anchor="middle" font-size="13" font-weight="700">Draft</text></g>
  </g>

  <!-- finding -> seal -->
  <path id="w1" d="M642 385 L756 385" stroke="#0e8f7e" stroke-width="2.5" fill="none" marker-end="url(#arrT)"/>
  <circle r="4.5" fill="#0e8f7e"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
  <text x="699" y="368" text-anchor="middle" font-size="11" class="mono muted">finding · data</text>

  <!-- amber seal -->
  <g transform="translate(812 385)">
    <circle class="ring" r="54" fill="none" stroke="#ff9a3d" stroke-width="2"/>
    <g class="breath">
      <circle r="54" fill="url(#mango)" filter="url(#glow)"/>
      <circle r="45" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" opacity=".85"/>
      <circle cy="-10" r="10" fill="#3a1c00"/><path d="M-18 18 a18 18 0 0 1 36 0 z" fill="#3a1c00"/>
      <text y="36" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3a1c00" letter-spacing="1.5">APPROVES</text>
    </g>
    <text y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">HUMAN AUTHORITY</text>
    <text y="104" text-anchor="middle" font-size="11" class="dim">decides · signs · accountable</text>
  </g>

  <!-- seal -> record -->
  <path id="w2" d="M868 385 L942 385" stroke="#e8730f" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/>
  <circle r="4.5" fill="#e8730f"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
  <text x="905" y="368" text-anchor="middle" font-size="11" class="mono" fill="#b45309">decision</text>

  <!-- system of record -->
  <g transform="translate(956 334)">
    <rect width="180" height="102" rx="14" fill="#ffffff" stroke="#b8e3da" stroke-width="1.5" filter="url(#shadow)"/>
    <g transform="translate(90 32)" fill="none" stroke="#0e8f7e" stroke-width="2"><ellipse rx="18" ry="6.5"/><path d="M-18 0 v16 a18 6.5 0 0 0 36 0 v-16"/><path d="M-18 8 a18 6.5 0 0 0 36 0" opacity=".5"/></g>
    <text x="90" y="72" text-anchor="middle" font-size="12.5" font-weight="700">System of record</text>
    <text x="90" y="88" text-anchor="middle" font-size="10.5" class="dim mono">Dataverse · audit trail</text>
  </g>

  <text x="600" y="598" text-anchor="middle" font-size="14.5" class="muted">Specialized agents do the reasoning. The <tspan fill="#b45309" font-weight="700">amber seal</tspan> marks where a person, not an agent, holds the authority.</text>
  </g>
  <rect x="1" y="1" width="1198" height="628" rx="21" fill="none" stroke="#b8e3da" stroke-width="2"/>
</svg>
