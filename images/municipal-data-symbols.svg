<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc"><title id="title">The objects are the legend.</title><desc id="desc">Physical civic evidence objects form an animated still life: a leather register, sweeping radar, charter with a municipal seal, and brass compass. Engraved line samples below distinguish authoritative, inferred, unverified, and similar. Color alone is never the key.</desc>
