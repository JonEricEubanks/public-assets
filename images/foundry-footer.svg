<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#f2fbf8"/><stop offset="100%" stop-color="#d6efe8"/>
    </radialGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffc466"/><stop offset="100%" stop-color="#ff7b1c"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b2a25" flood-opacity=".10"/></filter>
    <path id="book" d="M2 4a2 2 0 0 1 2-2h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6a2 2 0 0 1 2 2v15a1 1 0 0 1-1 1h-7a2 2 0 0 0-2 1 2 2 0 0 0-2-1H3a1 1 0 0 1-1-1zm10 1v14M4 4v14h6a3 3 0 0 1 1.5.4V5.5A2 2 0 0 0 10 4zm16 0h-6a2 2 0 0 0-1.5 1.5v12.9A3 3 0 0 1 14 18h6z"/>
    <g id="noteT"><ellipse rx="6.5" ry="4.5" transform="rotate(-20)" fill="#0e8f7e"/><path d="M5.5 -2 V-30" stroke="#0e8f7e" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="noteV"><ellipse rx="6.5" ry="4.5" transform="rotate(-20)" fill="#7c3aed"/><path d="M5.5 -2 V-30" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round"/></g>
    <clipPath id="frame"><rect width="1200" height="260" rx="22"/></clipPath>
  </defs>
  <style>
    text{fill:#0b2a25}
    .mono{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
    .muted{fill:#3f7d73}.dim{fill:#6fa79c}
    .trace{stroke-dasharray:.12 .88;animation:trace 4s linear infinite}
    @keyframes trace{to{stroke-dashoffset:-1}}
    .play{animation:play 10s linear infinite}
    @keyframes play{0%{transform:translateX(0)}100%{transform:translateX(352px)}}
    .n{animation:n 10s linear infinite}
    .n2{animation-delay:1.7s}.n3{animation-delay:3.4s}.n4{animation-delay:5.1s}.n5{animation-delay:6.8s}
    @keyframes n{0%,100%{opacity:.5}3%,14%{opacity:1}20%{opacity:.5}}
    .breath{animation:breath 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    .baton{animation:baton 4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 100%}
    @keyframes baton{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
    .yours{transform-box:fill-box;transform-origin:center;animation:yours 10s linear 1 both}
    @keyframes yours{0%,80%{opacity:0;transform:scale(.9)}86%{opacity:1;transform:scale(1.04)}90%{transform:scale(1)}100%{opacity:1;transform:scale(1)}}
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- left: takeaway + resource -->
  <text x="80" y="82" font-size="32" font-weight="900">Start with one agent.</text>
  <text x="80" y="114" font-size="17" class="muted">Add a second only when it earns a distinct responsibility and its own boundary.</text>
  <g transform="translate(80 144)">
    <rect width="600" height="48" rx="24" fill="#ffffff" stroke="#b8e3da" stroke-width="1.5" filter="url(#shadow)"/>
    <rect class="trace" width="600" height="48" rx="24" fill="none" stroke="url(#mango)" stroke-width="2" pathLength="1" stroke-linecap="round"/>
    <use href="#book" transform="translate(22 12)" fill="none" stroke="#0e8f7e" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="60" y="31" font-size="15" class="mono" fill="#0e6f62">learn.microsoft.com/agent-framework/workflows/orchestrations</text>
  </g>
  <text x="80" y="228" font-size="14" class="dim">Pick the least complex score that finishes the work reliably, securely, and economically.</text>

  <!-- right: the score -->
  <g transform="translate(740 44)">
    <!-- staff -->
    <g stroke="#0e8f7e" stroke-width="1" opacity=".35"><path d="M0 20 H380 M0 32 H380 M0 44 H380 M0 56 H380 M0 68 H380"/></g>
    <!-- time signature -->
    <text x="8" y="41" font-size="15" font-weight="800" class="mono" fill="#0e6f62">5</text>
    <text x="8" y="65" font-size="15" font-weight="800" class="mono" fill="#0e6f62">1</text>
    <!-- final double bar -->
    <path d="M370 20 V68" stroke="#0e6f62" stroke-width="1.5"/><path d="M377 20 V68" stroke="#0e6f62" stroke-width="4"/>
    <!-- five notes -->
    <g class="n"><use href="#noteT" transform="translate(52 62)"/></g>
    <g class="n n2"><use href="#noteT" transform="translate(120 50)"/></g>
    <g class="n n3"><use href="#noteT" transform="translate(188 38)"/></g>
    <g class="n n4"><use href="#noteV" transform="translate(256 50)"/></g>
    <g class="n n5"><use href="#noteV" transform="translate(324 32)"/></g>
    <!-- playhead -->
    <g class="play"><rect x="10" y="14" width="1.5" height="60" fill="#ff7b1c" opacity=".8"/></g>
    <!-- labels under notes -->
    <g font-size="9.5" class="mono" text-anchor="middle" fill="#0e6f62">
      <text x="52" y="94">sequential</text><text x="120" y="94">concurrent</text><text x="188" y="94">handoff</text>
      <text x="256" y="94" fill="#6b21a8">group chat</text><text x="324" y="94" fill="#6b21a8">magentic</text>
    </g>
    <text x="0" y="118" font-size="10.5" class="dim">order · parallel specialization · dynamic routing · collaborative review · adaptive planning</text>
  </g>

  <!-- conductor pill -->
  <g transform="translate(740 174)"><g class="yours">
    <rect width="380" height="44" rx="22" fill="url(#mango)" filter="url(#shadow)"/>
    <g transform="translate(24 22)">
      <g class="breath"><circle r="13" fill="#3a1c00"/><circle cy="-3" r="3.5" fill="#ffc466"/><path d="M-6 6 a6 6 0 0 1 12 0 z" fill="#ffc466"/></g>
      <g transform="translate(10 -4)"><path class="baton" d="M0 0 L16 -14" stroke="#3a1c00" stroke-width="1.8" stroke-linecap="round"/></g>
    </g>
    <text x="58" y="28" font-size="14" font-weight="800" fill="#3a1c00">the conductor decides — a person, not an agent</text>
  </g></g>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="21" fill="none" stroke="#b8e3da" stroke-width="2"/>
</svg>
