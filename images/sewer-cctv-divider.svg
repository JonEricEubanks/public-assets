<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" font-family="'Inter','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8d8f5"/><stop offset="100%" stop-color="#3f7fcf"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8d8f5" stop-opacity=".55"/><stop offset="100%" stop-color="#b8d8f5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .rail{stroke-dasharray:6 10;animation:march 1.6s linear infinite}
    @keyframes march{to{stroke-dashoffset:-16}}
    .crawl{animation:crawl 9s ease-in-out infinite}
    @keyframes crawl{0%{transform:translateX(0)}50%{transform:translateX(1020px)}100%{transform:translateX(0)}}
    .face{animation:face 9s ease-in-out infinite}
    @keyframes face{0%,49%{transform:scaleX(1)}50%,99%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
    .joint{animation:joint 2.4s ease-in-out infinite}
    .j2{animation-delay:-.8s}.j3{animation-delay:-1.6s}
    @keyframes joint{0%,100%{opacity:.35}50%{opacity:.9}}
    [class]{animation-fill-mode:both}
  </style>

  <!-- pipe walls -->
  <line x1="40" y1="24" x2="1160" y2="24" stroke="#22384f" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="1160" y2="46" stroke="#22384f" stroke-width="2" stroke-linecap="round"/>
  <!-- flow line -->
  <line class="rail" x1="40" y1="35" x2="1160" y2="35" stroke="#2f5a88" stroke-width="2" stroke-linecap="round"/>
  <!-- joints -->
  <g stroke="#4a86c5" stroke-width="2" stroke-linecap="round">
    <line class="joint" x1="260" y1="20" x2="260" y2="50"/>
    <line class="joint j2" x1="480" y1="20" x2="480" y2="50"/>
    <line class="joint j3" x1="720" y1="20" x2="720" y2="50"/>
    <line class="joint" x1="940" y1="20" x2="940" y2="50"/>
  </g>
  <circle cx="600" cy="35" r="3" fill="#7fb8f0"/>

  <!-- crawler -->
  <g transform="translate(80 35)">
    <g class="crawl">
      <g class="face">
        <path d="M8 0 L64 -10 L64 10 Z" fill="url(#beam)"/>
        <rect x="-14" y="-6" width="22" height="12" rx="3" fill="#0c1a2b" stroke="#5b9bd5" stroke-width="1.5"/>
        <circle cx="-9" cy="8" r="2.4" fill="#5b9bd5"/><circle cx="3" cy="8" r="2.4" fill="#5b9bd5"/>
        <circle cx="9" cy="0" r="4" fill="url(#mango)" filter="url(#glow)"/>
      </g>
    </g>
  </g>
</svg>
